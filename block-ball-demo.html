<body>
<!--
================================================================================
  BLOCK BALL — Single-Level Demo (Phaser 3 + Arcade Physics)
================================================================================

HOW TO RUN
----------
  Yarn (recommended):
       yarn install
       yarn start
     Then open http://localhost:8080/ (or /block-ball-demo.html)
     On your phone (same Wi‑Fi): http://YOUR_LOCAL_IP:8080/block-ball-demo.html

  1. Quick test: double-click block-ball-demo.html or drag it into a browser.
     (file:// works for this demo.)

  2. Without Yarn: python3 -m http.server 8080 in this folder, then open the URL above.

  3. Any static server works (VS Code Live Server, etc.).

MOBILE CONTROLS
---------------
  • Drag left/right on the BOTTOM HALF → move the paddle.
  • Ball on paddle: aim arrow cycles (↖ ↑ ↗); **release** to launch in that direction.
  • Power Bounce: drag while the ball falls (paddle grows & shakes), RELEASE to arm;
    the trampoline spring plays only when the ball hits the paddle successfully.
  • Chain Power Bounces on returns to keep momentum through hard sections.
  • No release timing → normal bounce; spikes cost a life when not powered.

PACKAGING FOR REAL MOBILE APPS
------------------------------
  Capacitor (recommended):
    1. npm create vite@latest block-ball-app -- --template vanilla
    2. Copy block-ball-demo.html into www/index.html (or merge into your build).
    3. npm install @capacitor/core @capacitor/cli @capacitor/ios @capacitor/android
    4. npx cap init "Block Ball" com.example.blockball
    5. npx cap add ios && npx cap add android
    6. Set capacitor.config.json webDir to "www", lock orientation to portrait.
    7. npx cap sync && npx cap open ios (or android)

  Cordova (legacy):
    1. cordova create block-ball com.example.blockball "Block Ball"
    2. Place this HTML as www/index.html
    3. cordova plugin add cordova-plugin-screen-orientation
    4. cordova platform add ios android && cordova run

  Also consider: fullscreen meta tags (already included), disable overscroll,
  asset atlases for production, and touch-action:none on the document (done).

================================================================================
-->

<script>
/* global Phaser, BLOCK_TYPES, BLOCK_CELL_MAP, getBlockDef, resolveBlockHit, getEnemyDef, resolveEnemyHit, createLevelGrid, ensurePlayBlockCells, drawLevelGridDebug, drawDevViewBorders, fitEntityToCell, fitEntityToCellSpan, ballRadiusForCell, resolveGridRow, resolveActiveLevel, populateLevelSelect, BLOCK_BALL_LEVELS, resolveHudLayout, DEFAULT_HUD_LAYOUT, generateHudAvatarTextures, resolveHudAvatarState, applyHudAvatarState, getHudAvatarTextureKey, HUD_AVATAR_STATES */

let ACTIVE_LEVEL = null;
const URL_PARAMS = new URLSearchParams(window.location.search);
const SHOW_LEVEL_GRID = URL_PARAMS.has('debugGrid');
/** Full game / HUD / play outlines. Disable with ?devBorders=0 */
const DEV_BORDERS = URL_PARAMS.get('devBorders') !== '0';

const DEBUG_LOG = true;

function bbLog(...args) {
  if (DEBUG_LOG) console.log('[BlockBall]', ...args);
}

function bbError(context, err) {
  console.error('[BlockBall]', context, err);
}

window.addEventListener('error', (e) => {
  bbError('window.error', e.error || e.message);
});

window.addEventListener('unhandledrejection', (e) => {
  bbError('unhandledrejection', e.reason);
});

// =============================================================================
// GAME CONFIG
// =============================================================================

const GAME_WIDTH = 390;
const GAME_HEIGHT = 780;

const COLORS = {
  bg: 0x2d1b4e,
  bgLight: 0x4a2c7a,
  paddle: 0x00d4aa,
  paddleDark: 0x00a080,
  ball: 0x4da6ff,
  ballHighlight: 0x8ec8ff,
  blockNormal: 0xfff5e6,
  blockNormalBorder: 0xffb347,
  blockGray: 0x9ca3af,
  blockGrayBorder: 0x4b5563,
  blockPower: 0x6b7280,
  blockPowerBorder: 0x374151,
  blockPowerGlow: 0xffe66d,
  spike: 0xff3366,
  enemy: 0xff6bcb,
  enemyDark: 0xc94d9a,
  text: '#ffffff',
  accent: '#ffe66d',
  danger: '#ff3366',
};

const PHYSICS = {
  ballSpeed: 380,
  ballMaxSpeed: 520,
  powerBallMaxSpeed: 760,
  launchSpeed: 420,
  powerBounceSpeed: 680,
  powerAngleAmp: 1.38,
  paddleBounceFactor: 1.05,
};

/** Aim while ball on paddle: left 45° → straight up → right 45° (screen coords, y down). */
const LAUNCH_AIM_TICK_MS = 650;
const LAUNCH_AIM_DIRS = [
  { vx: -1 / Math.SQRT2, vy: -1 / Math.SQRT2 },
  { vx: 0, vy: -1 },
  { vx: 1 / Math.SQRT2, vy: -1 / Math.SQRT2 },
];

const SCORE = {
  powerMultiplier: 1.5,
};

const POWER_BOUNCE = {
  /** Release arms power; paddle hit must occur within this window (ms) */
  queueWindowMs: 1100,
  /** Ball falling — used for charge visuals */
  minFallSpeed: 18,
  /** How far above/below paddle center release can arm power */
  armAbovePaddle: 240,
  armBelowPaddle: 48,
  /** Charge ring / shake while ball is in this zone above paddle */
  chargeAbovePaddle: 200,
  chargeBelowPaddle: 40,
  /** Brief slow-mo emphasis on perfect Power Bounce (real-time ms) */
  slowMoRealMs: 130,
  slowMoTimeScale: 0.32,
};

const POWER_BALL = {
  durationMs: 2800,
  cooldownMs: 500,
  scale: 1.24,
  tint: 0xfff0a0,
};

// =============================================================================
// TEXTURE GENERATION (generic shapes — no franchise assets)
// =============================================================================

function generateTextures(scene, cellW, cellH) {
  const g = scene.make.graphics({ x: 0, y: 0, add: false });
  const pad = 2;
  const innerW = cellW - pad * 2;
  const innerH = cellH - pad * 2;
  const paddleColSpan = (ACTIVE_LEVEL?.paddle?.colSpan) ?? 2;
  const paddleW = paddleColSpan * cellW - pad;
  const paddleTexH = cellH * 0.5;
  const paddleInnerH = paddleTexH - pad - 2;

  // Paddle (colSpan wide × half cell tall)
  g.clear();
  g.fillStyle(COLORS.paddleDark, 1);
  g.fillRoundedRect(0, 2, paddleW, paddleInnerH, 6);
  g.fillStyle(COLORS.paddle, 1);
  g.fillRoundedRect(0, 0, paddleW, paddleInnerH, 6);
  g.generateTexture('paddle', paddleW, paddleTexH);

  function drawBlockTexture(key, fill, border, extra) {
    g.clear();
    g.fillStyle(border, 1);
    g.fillRoundedRect(0, 0, innerW, innerH, 4);
    g.fillStyle(fill, 1);
    g.fillRoundedRect(2, 2, innerW - 4, innerH - 4, 3);
    if (extra) extra(g, innerW, innerH);
    g.generateTexture(key, cellW, cellH);
  }

  drawBlockTexture('block_normal', COLORS.blockNormal, COLORS.blockNormalBorder);
  drawBlockTexture('block_gray', COLORS.blockGray, COLORS.blockGrayBorder, (gfx, w, h) => {
    gfx.lineStyle(1, 0x6b7280, 0.8);
    gfx.strokeRect(w * 0.2, h * 0.35, w * 0.6, h * 0.3);
  });
  drawBlockTexture('block_power', COLORS.blockPower, COLORS.blockPowerBorder, (gfx, w, h) => {
    gfx.lineStyle(2, COLORS.blockPowerGlow, 0.85);
    gfx.strokeRoundedRect(4, 4, w - 8, h - 8, 3);
    gfx.fillStyle(COLORS.blockPowerGlow, 0.35);
    gfx.fillRect(6, 6, w - 12, Math.max(4, h * 0.2));
  });

  // Spike hazard block (one cell)
  g.clear();
  g.fillStyle(0x4a1028, 1);
  g.fillRoundedRect(0, 0, innerW, innerH, 3);
  g.fillStyle(COLORS.spike, 1);
  const spikeW = innerW / 3;
  for (let i = 0; i < 3; i++) {
    const cx = spikeW * i + spikeW * 0.5;
    const half = spikeW * 0.38;
    g.fillTriangle(cx - half, innerH, cx, innerH * 0.12, cx + half, innerH);
  }
  g.lineStyle(2, 0xcc1144, 0.7);
  g.strokeRect(1, innerH - 2, innerW - 2, 2);
  g.generateTexture('block_spike', cellW, cellH);

  // Ball (inscribed in one cell)
  const r = ballRadiusForCell({ config: { cellWidth: cellW, cellHeight: cellH } });
  g.clear();
  g.fillStyle(COLORS.ball, 1);
  g.fillCircle(r, r, r);
  g.fillStyle(COLORS.ballHighlight, 0.6);
  g.fillEllipse(r - 3, r - 4, r * 0.55, r * 0.4);
  g.fillStyle(0x1e3a5f, 1);
  g.fillCircle(r - r * 0.35, r - r * 0.05, Math.max(2, r * 0.22));
  g.fillCircle(r + r * 0.35, r - r * 0.05, Math.max(2, r * 0.22));
  g.fillStyle(0xffffff, 1);
  g.fillCircle(r - r * 0.3, r - r * 0.12, Math.max(1, r * 0.08));
  g.fillCircle(r + r * 0.42, r - r * 0.12, Math.max(1, r * 0.08));
  g.lineStyle(2, 0x1e3a5f, 1);
  g.beginPath();
  g.arc(r, r + r * 0.25, r * 0.35, 0.2, Math.PI - 0.2, false);
  g.strokePath();
  g.generateTexture('ball', r * 2, r * 2);

  // Life icon (mini ball)
  g.clear();
  g.fillStyle(COLORS.ball, 1);
  g.fillCircle(8, 8, 8);
  g.generateTexture('life_icon', 16, 16);

  generateHudAvatarTextures(scene, 48);

  // Enemy (one cell)
  g.clear();
  g.fillStyle(COLORS.enemyDark, 1);
  g.fillEllipse(cellW / 2, cellH * 0.65, innerW * 0.85, innerH * 0.7);
  g.fillStyle(COLORS.enemy, 1);
  g.fillEllipse(cellW / 2, cellH * 0.58, innerW * 0.8, innerH * 0.65);
  g.fillStyle(0xffffff, 1);
  g.fillCircle(cellW * 0.35, cellH * 0.42, Math.max(3, cellW * 0.1));
  g.fillCircle(cellW * 0.65, cellH * 0.42, Math.max(3, cellW * 0.1));
  g.fillStyle(0x1e3a5f, 1);
  g.fillCircle(cellW * 0.35, cellH * 0.42, Math.max(2, cellW * 0.05));
  g.fillCircle(cellW * 0.65, cellH * 0.42, Math.max(2, cellW * 0.05));
  g.fillStyle(0x1e3a5f, 0.8);
  g.fillEllipse(cellW / 2, cellH * 0.72, cellW * 0.15, cellH * 0.1);
  g.generateTexture('enemy', cellW, cellH);

  // Particle spark
  g.clear();
  g.fillStyle(0xffffff, 1);
  g.fillCircle(4, 4, 4);
  g.generateTexture('particle', 8, 8);

  g.destroy();
}

// =============================================================================
// MAIN SCENE
// =============================================================================

class GameScene extends Phaser.Scene {
  constructor() {
    super({ key: 'GameScene' });
  }

  clearPaddleTweenRefs() {
    this.paddleChargeScaleTween = null;
    this.paddleChargeShakeTween = null;
  }

  killPaddleTweens() {
    if (this.paddle) this.tweens.killTweensOf(this.paddle);
    this.clearPaddleTweenRefs();
  }

  finishPaddleSpring() {
    this.paddleSpringing = false;
    this.killPaddleTweens();
    this.resetPaddleVisual();
  }

  preparePaddleForCharge() {
    if (this.paddleSpringing) {
      this.finishPaddleSpring();
    } else {
      this.killPaddleTweens();
      this.resetPaddleVisual();
    }
  }

  isSceneActive() {
    return Boolean(this.sys?.isActive());
  }

  safeStopTween(tween) {
    if (!tween) return;
    try {
      if (typeof tween.isPlaying === 'function' && tween.isPlaying()) {
        tween.stop();
      }
    } catch (err) {
      bbError('safeStopTween', err);
    }
  }

  create() {
    bbLog('create() start');
    this.gameState = 'playing'; // playing | levelClear | gameOver
    this.score = 0;
    this.ballLaunched = false;
    this.ballOnPaddle = true;
    this.powerBounceQueued = false;
    this.powerBounceQueuedAt = 0;
    this.powerBounceActive = false;
    this.powerBounceMultiplier = false;
    this.ballPowerMode = false;
    this.ballPowerCooling = false;
    this.powerBallTimer = null;
    this.blocksRemaining = 0;
    this.dragging = false;
    this.pointerWasDragging = false;
    this.isLosingBall = false;
    this.paddleCharging = false;
    this.paddleSpringing = false;
    this.paddleChargeScaleTween = null;
    this.paddleChargeShakeTween = null;
    this.bottomHalfTouchThisStroke = false;
    this.pendingPowerSpring = false;

    this.launchAimIndex = 0;
    this.launchAimDirection = 1;
    this.launchAimTickEvent = null;
    this.aimArrowGfx = null;

    const { width, height } = this.scale;
    this.level = ACTIVE_LEVEL;
    this.levelGrid = createLevelGrid(this.level, height, width);
    this.lives = this.level.meta?.lives ?? 3;

    // Background gradient bands
    this.add.rectangle(width / 2, height / 2, width, height, COLORS.bg);
    this.add.rectangle(width / 2, height * 0.35, width, height * 0.5, COLORS.bgLight, 0.35);

    // Arcade frame lines
    const frame = this.add.graphics();
    frame.lineStyle(3, 0xffe66d, 0.5);
    frame.strokeRect(8, 8, width - 16, height - 16);

    generateTextures(this, this.levelGrid.config.cellWidth, this.levelGrid.config.cellHeight);
    this.ballRadius = ballRadiusForCell(this.levelGrid);
    this.gridCellH = this.levelGrid.config.cellHeight;

    // Physics world — only the playfield (below HUD), not the full frame
    const playBounds = this.levelGrid.getPlayBounds();
    this.physics.world.setBounds(playBounds.x, playBounds.y, playBounds.width, playBounds.height);
    this.physics.world.setBoundsCollision(true, true, true, false);

    this.createBlocks();
    this.createEnemies();
    this.createPaddle();
    this.createBall();
    this.setupCollisions();
    this.createUI();
    this.setupInput();

    if (SHOW_LEVEL_GRID) {
      drawLevelGridDebug(this, this.levelGrid, this.level);
    }

    if (DEV_BORDERS) {
      drawDevViewBorders(this, this.levelGrid, width, height);
    }

    this.updateUI();
    bbLog('create() complete', { blocks: this.blocksRemaining, lives: this.lives });
  }

  // ---------------------------------------------------------------------------
  // Level geometry
  // ---------------------------------------------------------------------------

  createBlocks() {
    const cells = ensurePlayBlockCells(this.level, this.levelGrid);

    this.blocks = this.physics.add.staticGroup();
    this.blocksRemaining = 0;

    const spawnBlock = (x, y, cell, gridCol, gridRow) => {
      const typeId = BLOCK_CELL_MAP[cell];
      if (!typeId) return;
      const def = getBlockDef(typeId);

      const block = this.blocks.create(x, y, def.texture);
      fitEntityToCell(block, this.levelGrid);
      block.refreshBody();
      block.setDepth(def.isHazard ? 8 : 5);
      block.setData('typeId', typeId);
      block.setData('points', def.points);
      block.setData('isPower', def.powerOnly);
      block.setData('isHazard', Boolean(def.isHazard));
      block.setData('gridCol', gridCol);
      block.setData('gridRow', gridRow);
      if (def.countsTowardClear !== false) this.blocksRemaining++;
    };

    for (let row = 0; row < cells.length; row++) {
      for (let col = 0; col < cells[row].length; col++) {
        const cell = cells[row][col];
        if (cell === 0) continue;
        const { x, y } = this.levelGrid.cellCenter(col, row);
        spawnBlock(x, y, cell, col, row);
      }
    }
  }

  createEnemies() {
    const spawns = this.level.enemies || [];

    this.enemies = this.physics.add.group();
    spawns.forEach((spawn, i) => {
      const { x, y } = this.levelGrid.cellCenter(spawn.col, spawn.row);
      this.spawnEnemy(spawn.type, x, y, i);
    });
  }

  spawnEnemy(typeId, x, y, index) {
    const def = getEnemyDef(typeId);
    const enemy = this.enemies.create(x, y, def.texture);
    fitEntityToCell(enemy, this.levelGrid, { circle: true });
    enemy.setBounce(1);
    enemy.setCollideWorldBounds(true);
    enemy.setImmovable(true);
    enemy.body.allowGravity = false;
    enemy.setDepth(7);
    enemy.setData('typeId', typeId);
    enemy.setData('hp', def.hp);
    enemy.setData('maxHp', def.maxHp);
    enemy.setData('points', def.points);
    enemy.setData('drop', def.drop);

    this.applyEnemyMovement(enemy, def, index, x, y);
    return enemy;
  }

  applyEnemyMovement(enemy, def, index, startX, startY) {
    switch (def.movement) {
      case 'erratic_float':
      default:
        this.tweens.add({
          targets: enemy,
          x: startX + (index % 2 === 0 ? this.levelGrid.config.cellWidth : -this.levelGrid.config.cellWidth),
          duration: 2200 + index * 400,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut',
        });
        break;
    }
    enemy.setData('baseX', startX);
  }

  createPaddle() {
    const paddleDef = this.level.paddle || { col: 4, colSpan: 2, rowFromBottom: 2 };
    const colSpan = paddleDef.colSpan ?? 2;
    const paddleRow = resolveGridRow(this.levelGrid, paddleDef);
    const { x: paddleX, y: paddleY } = this.levelGrid.cellSpanCenter(
      paddleDef.col,
      paddleRow,
      colSpan,
      1
    );
    this.paddle = this.physics.add.image(paddleX, paddleY, 'paddle');
    fitEntityToCellSpan(this.paddle, this.levelGrid, colSpan, 1, { heightFraction: 0.5 });
    this.paddle.setImmovable(true);
    this.paddle.body.allowGravity = false;
    this.paddle.setCollideWorldBounds(true);
    this.paddle.setDepth(10);
    this.paddle.setOrigin(0.5, 0.5);
  }

  createBall() {
    this.ballAura = this.add.graphics().setDepth(10);
    this.ball = this.physics.add.image(this.paddle.x, this.paddle.y, 'ball');
    this.ball.setDisplaySize(this.ballRadius * 2, this.ballRadius * 2);
    this.ball.body.setCircle(this.ballRadius);
    this.ball.setBounce(1);
    this.ball.setCollideWorldBounds(true);
    this.ball.body.onWorldBounds = true;
    this.ball.setDepth(11);
    this.ball.setOrigin(0.5, 0.5);
    this.ball.body.allowGravity = false;
    this.ballBaseScale = 1;
    this.physics.world.gravity.y = 0;

    this.attachBallToPaddle(false);
  }

  attachBallToPaddle(deferAim = false) {
    this.ballOnPaddle = true;
    this.ballLaunched = false;
    this.pendingPowerSpring = false;
    this.ball.body.setVelocity(0, 0);
    this.ball.body.moves = false;
    this.clearBallPowerState();
    this.finishPaddleSpring();
    this.syncBallToPaddle();
    this.launchAimIndex = 0;
    this.launchAimDirection = 1;
    if (deferAim) {
      this.stopLaunchAimCycle();
    } else {
      this.startLaunchAimCycle();
    }
  }

  startLaunchAimCycle() {
    this.stopLaunchAimCycle();
    if (!this.aimArrowGfx) {
      this.aimArrowGfx = this.add.graphics().setDepth(12).setScrollFactor(0);
    }
    this.launchAimTickEvent = this.time.addEvent({
      delay: LAUNCH_AIM_TICK_MS,
      loop: true,
      callback: () => {
        if (!this.ballOnPaddle || this.gameState !== 'playing' || this.isLosingBall) return;
        let next = this.launchAimIndex + this.launchAimDirection;
        if (next < 0 || next >= LAUNCH_AIM_DIRS.length) {
          this.launchAimDirection *= -1;
          next = this.launchAimIndex + this.launchAimDirection;
        }
        this.launchAimIndex = next;
        this.redrawAimArrow();
      },
    });
    this.redrawAimArrow();
  }

  stopLaunchAimCycle() {
    if (this.launchAimTickEvent) {
      this.launchAimTickEvent.destroy();
      this.launchAimTickEvent = null;
    }
    if (this.aimArrowGfx) {
      this.aimArrowGfx.clear();
    }
  }

  redrawAimArrow() {
    if (!this.aimArrowGfx || !this.ballOnPaddle || !this.ball?.active || this.isLosingBall) {
      if (this.aimArrowGfx) this.aimArrowGfx.clear();
      return;
    }
    const d = LAUNCH_AIM_DIRS[this.launchAimIndex];
    const bx = this.ball.x;
    const by = this.ball.y;
    const shaftLen = this.ballRadius + 36;
    const tipX = bx + d.vx * shaftLen;
    const tipY = by + d.vy * shaftLen;
    const px = -d.vy;
    const py = d.vx;
    const hw = 7;

    this.aimArrowGfx.clear();
    this.aimArrowGfx.lineStyle(4, 0xffe66d, 0.95);
    this.aimArrowGfx.beginPath();
    this.aimArrowGfx.moveTo(bx + d.vx * (this.ballRadius + 4), by + d.vy * (this.ballRadius + 4));
    this.aimArrowGfx.lineTo(tipX, tipY);
    this.aimArrowGfx.strokePath();

    this.aimArrowGfx.fillStyle(0xffe66d, 0.95);
    this.aimArrowGfx.fillTriangle(
      tipX,
      tipY,
      tipX - d.vx * 14 + px * hw,
      tipY - d.vy * 14 + py * hw,
      tipX - d.vx * 14 - px * hw,
      tipY - d.vy * 14 - py * hw
    );
  }

  syncBallToPaddle() {
    if (this.ballOnPaddle && this.paddle) {
      this.ball.x = this.paddle.x;
      const above = this.paddle.displayHeight * 0.5 + this.ballRadius + 2;
      this.ball.y = this.paddle.y - above;
    }
    if (this.ballOnPaddle && !this.isLosingBall) this.redrawAimArrow();
  }

  launchBall() {
    if (!this.ballOnPaddle || this.gameState !== 'playing' || this.isLosingBall) return;
    this.stopLaunchAimCycle();
    const d = LAUNCH_AIM_DIRS[this.launchAimIndex];
    this.ballOnPaddle = false;
    this.ballLaunched = true;
    this.ball.body.moves = true;
    this.ball.setVelocity(d.vx * PHYSICS.launchSpeed, d.vy * PHYSICS.launchSpeed);
  }

  // ---------------------------------------------------------------------------
  // Collisions
  // ---------------------------------------------------------------------------

  setupCollisions() {
    this.physics.add.collider(this.ball, this.blocks, this.onBallBlock, null, this);
    this.physics.add.collider(this.ball, this.paddle, this.onBallPaddle, null, this);
    this.physics.add.collider(this.ball, this.enemies, this.onBallEnemy, null, this);
    this.physics.add.collider(this.enemies, this.blocks);
    this.physics.world.on('worldbounds', (body) => {
      if (body.gameObject === this.ball && body.blocked.down === false) {
        // Top/side bounces handled by physics; bottom = lose ball
      }
    });
  }

  onBallBlock(ball, block) {
    if (!block.active) return;

    const typeId = block.getData('typeId') || 'normal';
    const result = resolveBlockHit(typeId, this.powerBounceActive || this.ballPowerMode);

    if (result.action === 'immune') {
      this.flashBlock(block, 0xaaaaaa);
      return;
    }

    if (result.action === 'hazard' || result.action === 'hazard_bounce') {
      this.onBallSpike(ball, block, result.action === 'hazard_bounce');
      return;
    }

    if (result.action === 'downgrade') {
      this.downgradeBlock(block, result.toType);
      this.clampBallSpeed();
      return;
    }

    if (result.action === 'destroy') {
      let points = result.points;
      if (this.powerBounceMultiplier) {
        points = Math.floor(points * SCORE.powerMultiplier);
      }
      this.addScore(points);
      this.destroyBlock(block);
      this.clampBallSpeed();
    }
  }

  downgradeBlock(block, toTypeId) {
    const def = getBlockDef(toTypeId);
    block.setTexture(def.texture);
    block.setData('typeId', toTypeId);
    block.setData('points', def.points);
    block.setData('isPower', def.powerOnly);
    block.refreshBody();
    this.flashBlock(block, 0xdddddd);
    bbLog('block downgraded', { to: toTypeId });
  }

  onBallPaddle(ball, paddle) {
    if (this.ballOnPaddle) return;

    const diff = ball.x - paddle.x;
    const normalized = Phaser.Math.Clamp(diff / (paddle.displayWidth * 0.5), -1, 1);
    const now = this.time.now;
    const queueElapsed = now - this.powerBounceQueuedAt;
    const queuedPower =
      this.powerBounceQueued && queueElapsed <= POWER_BOUNCE.queueWindowMs;

    let vx = normalized * PHYSICS.ballSpeed * 0.85;
    let vy;

    const fingerStillDown = this.dragging;

    if (queuedPower) {
      bbLog('Power Bounce hit — trampoline spring + power ball');
      this.paddle.clearTint();
      // Amplified angle: center ≈ vertical, edges = sharper (spec)
      if (Math.abs(normalized) < 0.22) {
        vx = normalized * PHYSICS.ballSpeed * 0.4;
        vy = -PHYSICS.powerBounceSpeed * 1.1;
      } else {
        vx = normalized * PHYSICS.ballSpeed * PHYSICS.powerAngleAmp;
        vy = -PHYSICS.powerBounceSpeed;
      }
      this.powerBounceQueued = false;
      this.enterBallPowerMode();
      if (fingerStillDown) {
        // Spring plays on release so charge can continue until then
        this.pendingPowerSpring = true;
      } else {
        this.doPaddleSpringBounce();
      }
      this.flashBallPowerSuccess();
      this.triggerPerfectTimingFeedback();
    } else {
      if (this.powerBounceQueued) {
        bbLog('power bounce not applied', {
          queueElapsed,
          windowMs: POWER_BOUNCE.queueWindowMs,
          vy: ball.body.velocity.y,
        });
      }
      this.powerBounceQueued = false;
      vy = -Math.abs(ball.body.velocity.y) * PHYSICS.paddleBounceFactor;
      if (vy > -280) vy = -280;
      if (!fingerStillDown) {
        this.doPaddleNormalTap();
      }
    }

    ball.setVelocity(vx, vy);
    this.clampBallSpeed();

    if (fingerStillDown) {
      this.maintainPaddleChargeWhileDragging();
    }
  }

  onBallEnemy(ball, enemy) {
    if (!enemy.active) return;

    const typeId = enemy.getData('typeId') || 'drifter';
    const { damage, pointsOnKill } = resolveEnemyHit(typeId, this.powerBounceActive);
    let hp = (enemy.getData('hp') || 1) - damage;
    enemy.setData('hp', hp);

    if (hp > 0) {
      this.flashEnemyHit(enemy);
      this.clampBallSpeed();
      bbLog('enemy damaged', { typeId, hp, damage });
      return;
    }

    let points = pointsOnKill;
    if (this.powerBounceMultiplier) {
      points = Math.floor(points * SCORE.powerMultiplier);
    }
    this.addScore(points);
    this.spawnDestroyParticles(enemy.x, enemy.y, COLORS.enemy);
    enemy.destroy();
    this.clampBallSpeed();
    bbLog('enemy defeated', { typeId, points });
  }

  flashEnemyHit(enemy) {
    enemy.setTint(0xffffff);
    this.tweens.add({
      targets: enemy,
      alpha: 0.65,
      duration: 50,
      yoyo: true,
      onComplete: () => {
        if (enemy.active) {
          enemy.clearTint();
          enemy.setAlpha(1);
        }
      },
    });
  }

  onBallSpike(ball, block, poweredBounce) {
    if (this.ballOnPaddle || this.gameState !== 'playing') return;

    if (poweredBounce || this.ballPowerMode) {
      const pushX = ball.body.velocity.x * 1.05 || (ball.x < this.scale.width / 2 ? -140 : 140);
      ball.setVelocity(pushX, -Math.max(380, Math.abs(ball.body.velocity.y) * 1.2));
      this.spawnDestroyParticles(ball.x, ball.y, 0xffe66d);
      if (block?.active) this.flashBlock(block, 0xffe66d);
      this.clampBallSpeed();
      return;
    }

    this.loseBall();
  }

  destroyBlock(block) {
    const tints = { normal: 0xffb347, gray: 0x9ca3af, power: 0xffe66d, spike: COLORS.spike };
    const typeId = block.getData('typeId') || 'normal';
    this.spawnDestroyParticles(block.x, block.y, tints[typeId] || 0xffffff);
    block.destroy();
    this.blocksRemaining--;
    if (this.blocksRemaining <= 0) {
      this.time.delayedCall(300, () => this.showLevelClear());
    }
  }

  flashBlock(block, color) {
    this.tweens.add({
      targets: block,
      alpha: 0.5,
      duration: 60,
      yoyo: true,
    });
  }

  // ---------------------------------------------------------------------------
  // Ball lifecycle
  // ---------------------------------------------------------------------------

  loseBall() {
    if (this.gameState !== 'playing' || this.isLosingBall) return;
    bbLog('loseBall', { livesBefore: this.lives });
    this.isLosingBall = true;
    this.lives--;
    this.updateUI();
    this.spawnDestroyParticles(this.ball.x, this.ball.y, COLORS.ball);

    if (this.lives <= 0) {
      this.stopLaunchAimCycle();
      this.ball.setActive(false).setVisible(false);
      this.showGameOver();
      return;
    }

    this.attachBallToPaddle(true);
    this.powerBounceQueued = false;
    this.time.delayedCall(400, () => {
      this.isLosingBall = false;
      this.startLaunchAimCycle();
    });
  }

  clampBallSpeed() {
    const v = this.ball.body.velocity;
    const speed = Math.sqrt(v.x * v.x + v.y * v.y);
    const cap = this.ballPowerMode ? PHYSICS.powerBallMaxSpeed : PHYSICS.ballMaxSpeed;
    if (speed > cap) {
      const scale = cap / speed;
      this.ball.setVelocity(v.x * scale, v.y * scale);
    }
    if (speed < 200 && this.ballLaunched && !this.ballOnPaddle) {
      const scale = 220 / speed;
      this.ball.setVelocity(v.x * scale, v.y * scale);
    }
  }

  // ---------------------------------------------------------------------------
  // Input — drag paddle on bottom half; RELEASE in timing window arms Power Bounce
  // ---------------------------------------------------------------------------

  isBallNearPaddleForCharge() {
    if (!this.ball?.body || !this.paddle) return false;
    const dy = this.ball.y - this.paddle.y;
    return (
      dy > -POWER_BOUNCE.chargeAbovePaddle &&
      dy < POWER_BOUNCE.chargeBelowPaddle &&
      this.ball.body.velocity.y > POWER_BOUNCE.minFallSpeed
    );
  }

  canArmPowerOnRelease() {
    if (!this.ball?.body || !this.paddle) return false;
    if (!this.ballLaunched || this.ballOnPaddle) return false;
    const dy = this.ball.y - this.paddle.y;
    const inZone = dy > -POWER_BOUNCE.armAbovePaddle && dy < POWER_BOUNCE.armBelowPaddle;
    const falling = this.ball.body.velocity.y > POWER_BOUNCE.minFallSpeed;
    return inZone && falling;
  }

  queuePowerBounceOnRelease(wasPaddleTouch) {
    if (this.gameState !== 'playing') return false;
    if (!wasPaddleTouch) {
      bbLog('power bounce not queued — no bottom-half touch');
      return false;
    }
    if (!this.canArmPowerOnRelease()) {
      bbLog('power bounce not queued — outside arm window', {
        dy: this.ball.y - this.paddle.y,
        vy: this.ball.body.velocity.y,
      });
      return false;
    }

    this.powerBounceQueued = true;
    this.powerBounceQueuedAt = this.time.now;
    bbLog('power bounce queued', {
      at: this.powerBounceQueuedAt,
      dy: this.ball.y - this.paddle.y,
      vy: this.ball.body.velocity.y,
    });
    return true;
  }

  setupInput() {
    this.input.on('pointerdown', (pointer) => {
      if (this.gameState !== 'playing') return;

      const { height } = this.scale;
      const bottomHalf = pointer.y > height * 0.5;
      this.pointerWasDragging = false;
      this.bottomHalfTouchThisStroke = bottomHalf;

      if (this.ballOnPaddle) {
        if (this.isLosingBall) return;
        if (bottomHalf) {
          this.dragging = true;
          this.movePaddleToPointer(pointer);
        }
        return;
      }

      if (bottomHalf) {
        this.dragging = true;
        this.movePaddleToPointer(pointer);
      }
    });

    this.input.on('pointermove', (pointer) => {
      if (this.gameState !== 'playing' || !this.dragging) return;
      if (pointer.y > this.scale.height * 0.5) {
        this.pointerWasDragging = true;
        this.movePaddleToPointer(pointer);
      }
    });

    this.input.on('pointerup', () => {
      const wasPaddleTouch =
        this.bottomHalfTouchThisStroke || this.dragging || this.pointerWasDragging;
      const ballOnPaddleAtStart = this.ballOnPaddle;

      if (this.gameState === 'playing' && ballOnPaddleAtStart && !this.isLosingBall) {
        this.launchBall();
      }

      if (this.gameState === 'playing' && wasPaddleTouch && !ballOnPaddleAtStart && !this.ballOnPaddle) {
        const queued = this.queuePowerBounceOnRelease(wasPaddleTouch);
        if (this.pendingPowerSpring) {
          this.pendingPowerSpring = false;
          this.doPaddleSpringBounce();
        } else {
          this.paddleReleaseAnimation(queued);
        }
      } else if (!this.paddleSpringing) {
        this.stopPaddleCharge(true);
      }

      this.dragging = false;
      this.pointerWasDragging = false;
      this.bottomHalfTouchThisStroke = false;
    });
  }

  movePaddleToPointer(pointer) {
    const margin = 58;
    const { width } = this.scale;
    this.paddle.x = Phaser.Math.Clamp(pointer.x, margin, width - margin);
    if (this.ballOnPaddle) this.syncBallToPaddle();
  }

  // ---------------------------------------------------------------------------
  // UI
  // ---------------------------------------------------------------------------

  createUI() {
    const hud = this.levelGrid.hud;
    const maxLives = this.level.meta?.lives ?? 3;
    const textStyle = {
      fontFamily: 'system-ui, -apple-system, sans-serif',
      fontSize: '18px',
      color: COLORS.text,
    };

    if (!hud) {
      bbError('createUI', 'level.hud is required for HUD container');
      return;
    }

    const { x, y, width, height } = hud.bounds;
    this.hudContainer = this.add.container(x, y).setDepth(200).setScrollFactor(0);

    const hudBg = this.add.rectangle(width / 2, height / 2, width, height, 0x16082a, 0.94);
    this.hudContainer.add(hudBg);

    const hudFrame = this.add.graphics();
    hudFrame.lineStyle(2, 0xffe66d, 0.4);
    hudFrame.strokeRect(0, 0, width, height);
    this.hudContainer.add(hudFrame);

    const pos = resolveHudLayout(this.level, { width, height }, { maxLives });
    const hudLayout = { ...DEFAULT_HUD_LAYOUT, ...(this.level.hudLayout || {}) };

    this.scoreText = this.add.text(pos.score.x, pos.score.y, 'Score: 0', textStyle).setOrigin(0, 0.5);
    this.hudContainer.add(this.scoreText);

    const lifeStep = 20;
    this.livesContainer = this.add.container(pos.livesContainer.x, pos.livesContainer.y);
    this.lifeIcons = [];
    for (let i = 0; i < maxLives; i++) {
      const icon = this.add.image(-i * lifeStep - 8, 0, 'life_icon').setScale(0.85);
      this.lifeIcons.push(icon);
      this.livesContainer.add(icon);
    }
    this.hudContainer.add(this.livesContainer);

    this.hudAvatarState = 'default';
    this.hudAvatarConfig = { ...(this.level.hudLayout?.avatar || {}) };

    this.hudAvatar = null;
    if (hudLayout.right && hudLayout.right.includes('avatar')) {
      const avSize = pos.avatar.size;
      const startKey = getHudAvatarTextureKey('default', this.hudAvatarConfig);
      this.hudAvatar = this.add
        .image(pos.avatar.x, pos.avatar.y, startKey)
        .setDisplaySize(avSize, avSize)
        .setOrigin(0.5, 0.5);
      this.hudContainer.add(this.hudAvatar);
      this.updateHudAvatar();
    }

    this.playAreaDivider = this.add.graphics().setDepth(199).setScrollFactor(0);
    this.playAreaDivider.lineStyle(2, 0xffe66d, 0.35);
    this.playAreaDivider.lineBetween(x, y + height, x + width, y + height);
  }

  /** Updates portrait from gameplay state (power, charging, lives, etc.). */
  updateHudAvatar() {
    if (!this.hudAvatar) return;
    const stateId = resolveHudAvatarState({
      gameState: this.gameState,
      ballPowerMode: this.ballPowerMode,
      ballPowerCooling: this.ballPowerCooling,
      paddleCharging: this.paddleCharging,
      powerBounceQueued: this.powerBounceQueued,
      lives: this.lives,
    });
    this.hudAvatarState = applyHudAvatarState(this.hudAvatar, stateId, this.hudAvatarConfig);
  }

  /**
   * Force a portrait state (e.g. after loading custom textures).
   * Gameplay will override on the next updateHudAvatar() unless you set a lock later.
   */
  setHudAvatarState(stateId) {
    if (!this.hudAvatar) return;
    this.hudAvatarState = applyHudAvatarState(this.hudAvatar, stateId, this.hudAvatarConfig);
  }

  updateUI() {
    this.scoreText.setText(`Score: ${this.score}`);
    this.lifeIcons.forEach((icon, i) => {
      icon.setAlpha(i < this.lives ? 1 : 0.25);
      icon.setTint(i < this.lives ? 0xffffff : 0x666666);
    });
    this.updateHudAvatar();
  }

  addScore(pts) {
    this.score += pts;
    this.scoreText.setText(`Score: ${this.score}`);
    this.tweens.add({
      targets: this.scoreText,
      scaleX: 1.15,
      scaleY: 1.15,
      duration: 80,
      yoyo: true,
    });
  }

  resetPaddleVisual() {
    if (!this.paddle) return;
    this.paddle.setScale(1);
    this.paddle.angle = 0;
    this.paddle.clearTint();
  }

  startPaddleCharge() {
    if (this.paddleCharging) return;
    this.preparePaddleForCharge();
    bbLog('paddle charge start');
    this.paddleCharging = true;
    this.paddle.setTint(0xb8ffec);

    this.paddleChargeScaleTween = this.tweens.add({
      targets: this.paddle,
      scaleX: 1.16,
      scaleY: 0.86,
      duration: 220,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut',
    });

    this.paddleChargeShakeTween = this.tweens.add({
      targets: this.paddle,
      angle: 3,
      duration: 42,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut',
    });
  }

  stopPaddleCharge(resetVisual) {
    this.paddleCharging = false;
    this.safeStopTween(this.paddleChargeScaleTween);
    this.safeStopTween(this.paddleChargeShakeTween);
    this.clearPaddleTweenRefs();
    if (resetVisual && !this.paddleSpringing) {
      this.resetPaddleVisual();
    }
  }

  maintainPaddleChargeWhileDragging() {
    if (!this.dragging || this.ballOnPaddle || !this.ballLaunched) return;
    if (!this.paddleCharging) {
      this.startPaddleCharge();
    }
  }

  updatePaddleCharge() {
    if (this.gameState !== 'playing' || this.ballOnPaddle || !this.ballLaunched) {
      if (this.paddleCharging) this.stopPaddleCharge(true);
      return;
    }

    // Recover if spring flag stuck after a killed/completed tween chain
    if (this.paddleSpringing && this.paddle && this.tweens.getTweensOf(this.paddle).length === 0) {
      bbLog('paddle spring flag stuck — resetting');
      this.finishPaddleSpring();
    }

    // Finger down: keep shake for whole drag (even after power spring / powered ball)
    if (this.dragging) {
      const canStartCharge = this.isBallNearPaddleForCharge() || this.paddleCharging;
      if (canStartCharge && !this.paddleCharging) {
        this.startPaddleCharge();
      }
      return;
    }

    // Finger up: only charge when ball is falling near paddle
    const ready = this.isBallNearPaddleForCharge();
    if (ready && !this.paddleCharging) {
      this.startPaddleCharge();
    } else if (!ready && this.paddleCharging) {
      this.stopPaddleCharge(true);
    }
  }

  updateBallPowerVisual(time) {
    this.ballAura.clear();
    if (!this.ball.active || this.ballOnPaddle) return;

    const scale = this.ball.scaleX;
    const baseR = this.ballRadius * scale;
    const pulse = 1 + 0.12 * Math.sin(time / 90);

    if (this.ballPowerMode) {
      this.ballAura.lineStyle(3, 0xffe66d, 0.95);
      this.ballAura.strokeCircle(this.ball.x, this.ball.y, baseR * pulse + 4);
      this.ballAura.lineStyle(2, 0xffffff, 0.45);
      this.ballAura.strokeCircle(this.ball.x, this.ball.y, baseR * pulse + 8);
    } else if (this.ballPowerCooling) {
      const coolPulse = 1 + 0.06 * Math.sin(time / 120);
      this.ballAura.lineStyle(2, 0x9ca3af, 0.35);
      this.ballAura.strokeCircle(this.ball.x, this.ball.y, baseR * coolPulse + 2);
    }
  }

  clearBallPowerState() {
    if (this.powerBallTimer) {
      this.powerBallTimer.remove(false);
      this.powerBallTimer = null;
    }
    this.tweens.killTweensOf(this.ball);
    this.ballPowerMode = false;
    this.ballPowerCooling = false;
    this.powerBounceActive = false;
    this.powerBounceMultiplier = false;
    this.ball.setScale(this.ballBaseScale);
    this.ball.body.setCircle(this.ballRadius);
    this.ball.clearTint();
    this.ballAura.clear();
  }

  refreshPowerBallTimer() {
    if (this.powerBallTimer) this.powerBallTimer.remove(false);
    this.powerBallTimer = this.time.delayedCall(POWER_BALL.durationMs, () => {
      this.startBallPowerCooldown();
    });
  }

  enterBallPowerMode() {
    const chaining = this.ballPowerMode;

    if (this.powerBallTimer) this.powerBallTimer.remove(false);
    if (!chaining) this.tweens.killTweensOf(this.ball);

    this.ballPowerMode = true;
    this.ballPowerCooling = false;
    this.powerBounceActive = true;
    this.powerBounceMultiplier = true;

    this.ball.setTint(POWER_BALL.tint);
    if (!chaining) {
      this.tweens.add({
        targets: this.ball,
        scale: POWER_BALL.scale,
        duration: 120,
        ease: 'Back.easeOut',
      });
    }
    this.ball.body.setCircle(this.ballRadius * POWER_BALL.scale);
    this.refreshPowerBallTimer();
  }

  startBallPowerCooldown() {
    if (!this.ball.active || this.ballOnPaddle) return;

    this.ballPowerMode = false;
    this.ballPowerCooling = true;
    this.powerBounceActive = false;
    this.powerBounceMultiplier = false;

    this.tweens.killTweensOf(this.ball);
    this.tweens.add({
      targets: this.ball,
      scale: this.ballBaseScale,
      duration: POWER_BALL.cooldownMs,
      ease: 'Sine.easeInOut',
      onComplete: () => {
        this.ball.clearTint();
        this.ball.body.setCircle(this.ballRadius);
        this.ballPowerCooling = false;
        this.ballAura.clear();
      },
    });

    this.powerBallTimer = this.time.delayedCall(POWER_BALL.cooldownMs, () => {
      this.powerBallTimer = null;
      if (!this.ballPowerMode) {
        this.ballPowerCooling = false;
      }
    });
  }

  // ---------------------------------------------------------------------------
  // Effects
  // ---------------------------------------------------------------------------

  /**
   * Always plays on bottom-half release while ball is in play.
   * @param {boolean} armed — power queued; holds coil until ball hits or window expires
   */
  paddleReleaseAnimation(armed) {
    bbLog('paddle release animation', { armed });
    this.stopPaddleCharge(false);
    this.killPaddleTweens();
    this.paddleSpringing = true;

    const coilScaleX = armed ? 1.34 : 1.2;
    const coilScaleY = armed ? 0.5 : 0.64;

    if (armed) {
      this.paddle.setTint(0xd4fff0);
    } else {
      this.paddle.clearTint();
    }

    this.tweens.add({
      targets: this.paddle,
      scaleX: coilScaleX,
      scaleY: coilScaleY,
      angle: 0,
      duration: armed ? 75 : 60,
      ease: 'Quad.easeIn',
      onComplete: () => {
        if (!this.isSceneActive()) return;

        if (armed) {
          // Stay coiled — full trampoline spring runs on successful power hit
          this.paddleSpringing = false;
          return;
        }

        // Miss / early release: small rebound, then rest
        this.tweens.add({
          targets: this.paddle,
          scaleX: 1.08,
          scaleY: 1.06,
          duration: 85,
          ease: 'Back.easeOut',
          onComplete: () => {
            if (!this.isSceneActive()) return;
            this.tweens.add({
              targets: this.paddle,
              scaleX: 1,
              scaleY: 1,
              duration: 110,
              ease: 'Quad.easeOut',
              onComplete: () => {
                if (!this.isSceneActive()) return;
                this.finishPaddleSpring();
              },
            });
          },
        });
      },
    });
  }

  /** Trampoline spring on successful Power Bounce contact */
  doPaddleSpringBounce() {
    bbLog('paddle spring bounce');
    this.stopPaddleCharge(false);
    this.killPaddleTweens();
    this.paddleSpringing = true;
    this.paddle.clearTint();

    this.tweens.add({
      targets: this.paddle,
      scaleX: 1.58,
      scaleY: 0.4,
      angle: 0,
      duration: 45,
      ease: 'Quad.easeIn',
      onComplete: () => {
        if (!this.isSceneActive()) return;
        this.tweens.add({
          targets: this.paddle,
          scaleX: 1.22,
          scaleY: 1.42,
          duration: 95,
          ease: 'Back.easeOut',
          onComplete: () => {
            if (!this.isSceneActive()) return;
            this.tweens.add({
              targets: this.paddle,
              scaleX: 1,
              scaleY: 1,
              duration: 280,
              ease: 'Bounce.easeOut',
              onComplete: () => {
                if (!this.isSceneActive()) return;
                this.finishPaddleSpring();
              },
            });
          },
        });
      },
    });
  }

  /** Subtle trampoline tap on a normal bounce */
  doPaddleNormalTap() {
    if (this.paddleCharging) return;
    this.paddleSpringing = true;
    this.killPaddleTweens();
    this.tweens.add({
      targets: this.paddle,
      scaleX: 1.1,
      scaleY: 0.72,
      duration: 50,
      yoyo: true,
      ease: 'Quad.easeOut',
      onComplete: () => {
        if (!this.isSceneActive()) return;
        this.finishPaddleSpring();
      },
    });
  }

  flashBallPowerSuccess() {
    this.ball.setTint(0xffffff);
    this.time.delayedCall(90, () => {
      if (this.ball.active && this.ballPowerMode) {
        this.ball.setTint(POWER_BALL.tint);
      }
    });
  }

  triggerPerfectTimingFeedback() {
    if (typeof navigator !== 'undefined' && navigator.vibrate) {
      navigator.vibrate(12);
    }

    const overlay = this.add.rectangle(
      this.scale.width / 2,
      this.scale.height / 2,
      this.scale.width,
      this.scale.height,
      0xffffff,
      0.12
    ).setDepth(150);

    this.tweens.add({
      targets: overlay,
      alpha: 0,
      duration: POWER_BOUNCE.slowMoRealMs,
      onComplete: () => overlay.destroy(),
    });

    const prevScale = this.time.timeScale;
    this.time.timeScale = POWER_BOUNCE.slowMoTimeScale;
    window.setTimeout(() => {
      if (!this.isSceneActive()) return;
      if (this.time) this.time.timeScale = prevScale === 0 ? 1 : prevScale;
    }, POWER_BOUNCE.slowMoRealMs);
  }

  spawnDestroyParticles(x, y, tint) {
    const emitter = this.add.particles(x, y, 'particle', {
      speed: { min: 60, max: 180 },
      angle: { min: 0, max: 360 },
      scale: { start: 1.2, end: 0 },
      lifespan: 350,
      quantity: 10,
      tint: tint,
      blendMode: 'ADD',
    });
    this.time.delayedCall(400, () => emitter.destroy());
  }

  // ---------------------------------------------------------------------------
  // End screens
  // ---------------------------------------------------------------------------

  showOverlay(title, subtitle, buttonLabel, onRestart) {
    const { width, height } = this.scale;
    const overlay = this.add.container(0, 0).setDepth(250);

    const dim = this.add.rectangle(width / 2, height / 2, width, height, 0x000000, 0.75);
    const panel = this.add.rectangle(width / 2, height / 2, width - 48, 220, 0x1a1a2e, 0.95);
    panel.setStrokeStyle(3, 0xffe66d);

    const titleText = this.add
      .text(width / 2, height / 2 - 50, title, {
        fontFamily: 'system-ui, sans-serif',
        fontSize: '28px',
        color: COLORS.accent,
        fontStyle: 'bold',
      })
      .setOrigin(0.5);

    const subText = this.add
      .text(width / 2, height / 2, subtitle, {
        fontFamily: 'system-ui, sans-serif',
        fontSize: '18px',
        color: COLORS.text,
      })
      .setOrigin(0.5);

    const btnBg = this.add.rectangle(width / 2, height / 2 + 60, 180, 44, COLORS.paddle).setInteractive({ useHandCursor: true });
    const btnLabel = this.add
      .text(width / 2, height / 2 + 60, buttonLabel, {
        fontFamily: 'system-ui, sans-serif',
        fontSize: '18px',
        color: '#1a1a2e',
        fontStyle: 'bold',
      })
      .setOrigin(0.5);

    btnBg.on('pointerdown', () => {
      overlay.destroy();
      onRestart();
    });

    overlay.add([dim, panel, titleText, subText, btnBg, btnLabel]);
    return overlay;
  }

  showLevelClear() {
    if (this.gameState !== 'playing') return;
    this.gameState = 'levelClear';
    this.stopLaunchAimCycle();
    this.ball.body.setVelocity(0, 0);
    this.ball.body.moves = false;
    this.showOverlay('Level Clear!', `Final Score: ${this.score}`, 'Play Again', () => this.scene.restart());
  }

  showGameOver() {
    this.gameState = 'gameOver';
    this.stopLaunchAimCycle();
    this.showOverlay('Game Over', `Score: ${this.score}`, 'Try Again', () => this.scene.restart());
  }

  // ---------------------------------------------------------------------------
  // Update loop
  // ---------------------------------------------------------------------------

  update(time, delta) {
    if (this.gameState !== 'playing') return;

    try {
      if (this.ballOnPaddle) {
        this.syncBallToPaddle();
      } else if (this.ball?.active) {
        if (this.ball.y > this.scale.height - 28) {
          this.loseBall();
        }
        this.clampBallSpeed();
        this.updateBallPowerVisual(time);
      }

      this.updatePaddleCharge();
      this.updateHudAvatar();

      // Expire stale power bounce queue
      if (this.powerBounceQueued && time - this.powerBounceQueuedAt > POWER_BOUNCE.queueWindowMs) {
        this.powerBounceQueued = false;
        if (!this.paddleSpringing && !this.paddleCharging) {
          this.killPaddleTweens();
          this.resetPaddleVisual();
        }
      }

      // Keep enemy hitboxes aligned with tweened positions
      this.enemies?.getChildren().forEach((enemy) => {
        if (enemy.active && enemy.body) {
          enemy.body.reset(enemy.x, enemy.y);
        }
      });
    } catch (err) {
      bbError('update()', err);
    }
  }
}

// =============================================================================
// PHASER BOOT
// =============================================================================

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: GAME_WIDTH,
  height: GAME_HEIGHT,
  backgroundColor: '#1a1a2e',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
  },
  physics: {
    default: 'arcade',
    arcade: {
      gravity: { y: 0 },
      debug: false,
    },
  },
  scene: [GameScene],
  render: {
    antialias: true,
    pixelArt: false,
    roundPixels: true,
  },
};

bbLog('boot Phaser', { width: GAME_WIDTH, height: GAME_HEIGHT });

function initLevelBar(activeEntry) {
  const bar = document.getElementById('level-bar');
  const select = document.getElementById('level-select');
  if (activeEntry.id === 'preview') {
    const opt = document.createElement('option');
    opt.value = 'preview';
    opt.textContent = activeEntry.name || 'Editor preview';
    opt.selected = true;
    select.appendChild(opt);
    select.disabled = true;
  } else {
    populateLevelSelect(select, activeEntry.id);
  }
  bar.hidden = false;

  select.addEventListener('change', () => {
    const id = select.value;
    try {
      localStorage.setItem('blockBall.level', id);
    } catch (_) {
      /* ignore */
    }
    window.location.search = `?level=${encodeURIComponent(id)}`;
  });

  document.getElementById('level-restart').addEventListener('click', () => {
    window.location.reload();
  });
}

async function bootGame() {
  const status = document.getElementById('boot-status');
  try {
    const { level, entry } = await resolveActiveLevel();
    ACTIVE_LEVEL = level;
    bbLog('active level', entry.id, level.name);
    status.remove();
    initLevelBar(entry);
    new Phaser.Game(config);
    bbLog('Phaser.Game created');
  } catch (err) {
    bbError('boot', err);
    status.className = 'error';
    status.textContent = `Failed to load level: ${err.message}. Check levels/registry.js and your level script.`;
  }
}

bootGame();
</script>
