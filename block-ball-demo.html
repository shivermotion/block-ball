  <!--
================================================================================
  BLOCK BALL — Single-Level Demo (Phaser 3 + Arcade Physics)
================================================================================

HOW TO RUN
----------
  Yarn (recommended):
       yarn install
       yarn start
     Then open http://localhost:8080/ (or /block-ball-demo.html)
     On your phone (same Wi‑Fi): http://YOUR_LOCAL_IP:8080/block-ball-demo.html

  1. Quick test: double-click block-ball-demo.html or drag it into a browser.
     (file:// works for this demo.)

  2. Without Yarn: python3 -m http.server 8080 in this folder, then open the URL above.

  3. Any static server works (VS Code Live Server, etc.).

MOBILE CONTROLS
---------------
  • Drag left/right on the BOTTOM HALF → move the paddle.
  • Ball on paddle: aim arrow cycles (↖ ↑ ↗); **release** to launch in that direction.
  • Power Bounce: drag while the ball falls (paddle grows & shakes), RELEASE to arm;
    the trampoline spring plays only when the ball hits the paddle successfully.
  • Chain Power Bounces on returns to keep momentum through hard sections.
  • No release timing → normal bounce; spikes cost a life when not powered.

  3D overlay (experimental): add ?3d=1 — diorama-tilted Three.js meshes synced to ball + blocks.

PACKAGING FOR REAL MOBILE APPS
------------------------------
  Capacitor (recommended):
    1. npm create vite@latest block-ball-app -- --template vanilla
    2. Copy block-ball-demo.html into www/index.html (or merge into your build).
    3. npm install @capacitor/core @capacitor/cli @capacitor/ios @capacitor/android
    4. npx cap init "Block Ball" com.example.blockball
    5. npx cap add ios && npx cap add android
    6. Set capacitor.config.json webDir to "www", lock orientation to portrait.
    7. npx cap sync && npx cap open ios (or android)

  Cordova (legacy):
    1. cordova create block-ball com.example.blockball "Block Ball"
    2. Place this HTML as www/index.html
    3. cordova plugin add cordova-plugin-screen-orientation
    4. cordova platform add ios android && cordova run

  Also consider: fullscreen meta tags (already included), disable overscroll,
  asset atlases for production, and touch-action:none on the document (done).

================================================================================
-->

    function syncGameModalOverlayLayout(scene) {
      const parent = document.getElementById('game-container');
      const canvas = scene?.game?.canvas;
      if (!parent || !canvas) return null;

      scene.scale?.updateBounds?.();
      let modal = document.getElementById('game-modal-overlay');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'game-modal-overlay';
        modal.hidden = true;
        parent.appendChild(modal);
      }

      const canvasRect = canvas.getBoundingClientRect();
      const parentRect = parent.getBoundingClientRect();
      modal.style.left = `${canvasRect.left - parentRect.left}px`;
      modal.style.top = `${canvasRect.top - parentRect.top}px`;
      modal.style.width = `${canvasRect.width}px`;
      modal.style.height = `${canvasRect.height}px`;
      return modal;
    }

    function hideGameModalOverlay() {
      const modal = document.getElementById('game-modal-overlay');
      if (!modal) return;
      modal.hidden = true;
      modal.innerHTML = '';
    }

    function showGameModalOverlay(scene, { title, subtitle, buttons }) {
      const modal = syncGameModalOverlayLayout(scene);
      if (!modal) return null;

      modal.hidden = false;
      modal.innerHTML = '';

      const dim = document.createElement('div');
      dim.className = 'game-modal-dim';

      const panel = document.createElement('div');
      panel.className = 'game-modal-panel';

      const titleEl = document.createElement('h2');
      titleEl.className = 'game-modal-title';
      titleEl.textContent = title;

      const subEl = document.createElement('p');
      subEl.className = 'game-modal-subtitle';
      subEl.textContent = subtitle;

      const btnRow = document.createElement('div');
      btnRow.className = 'game-modal-buttons';

        const button = document.createElement('button');
        button.type = 'button';
        button.className =
          btn.primary === false ? 'game-modal-btn game-modal-btn--secondary' : 'game-modal-btn';
        button.textContent = btn.label;
        button.addEventListener('click', () => {
          hideGameModalOverlay();
          btn.onClick();
        });
        btnRow.appendChild(button);
      }

      panel.append(titleEl, subEl, btnRow);
      modal.append(dim, panel);
      return modal;
    }

    /** Matches procedural paddle texture size (see generateTextures). */
    const PADDLE_PAD = 2;

    function getPaddleDisplaySize(cellW, cellH, colSpan = 2) {
      return {
        width: Math.max(1, Math.round(colSpan * cellW - PADDLE_PAD)),
        height: Math.max(1, Math.round(cellH * 0.5)),
      };
    }

    /** Soft band for power-block god-ray sweep (canvas; ADD blend in scene). */
    function ensurePowerGodRayTexture(scene) {
      if (scene.textures.exists('power_godray')) return;

      const w = 64;
      const h = 168;
      const tex = scene.textures.createCanvas('power_godray', w, h);
      const ctx = tex.getContext();

      const hGrad = ctx.createLinearGradient(0, 0, w, 0);
      hGrad.addColorStop(0, 'rgba(255,255,255,0)');
      hGrad.addColorStop(0.4, 'rgba(255,255,255,0)');
      hGrad.addColorStop(0.5, 'rgba(255,255,255,1)');
      hGrad.addColorStop(0.6, 'rgba(255,255,255,0)');
      hGrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hGrad;
      ctx.fillRect(0, 0, w, h);

      const vGrad = ctx.createLinearGradient(0, 0, 0, h);
      vGrad.addColorStop(0, 'rgba(0,0,0,0)');
      vGrad.addColorStop(0.1, 'rgba(255,255,255,1)');
      vGrad.addColorStop(0.9, 'rgba(255,255,255,1)');
      vGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalCompositeOperation = 'destination-in';
      ctx.fillStyle = vGrad;
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'source-over';

      tex.refresh();
    }

    // =============================================================================
    // TEXTURE GENERATION (generic shapes — no franchise assets)
    // =============================================================================

    function generateTextures(scene, cellW, cellH) {
      ensurePowerGodRayTexture(scene);
      const g = scene.make.graphics({ x: 0, y: 0, add: false });
      const pad = 2;
      const innerW = cellW - pad * 2;
      const innerH = cellH - pad * 2;
      const paddleColSpan = (ACTIVE_LEVEL?.paddle?.colSpan) ?? 2;
      const paddleW = paddleColSpan * cellW - pad;
      const paddleTexH = cellH * 0.5;
      const paddleInnerH = paddleTexH - pad - 2;
      g.clear();
      g.fillStyle(COLORS.paddleDark, 1);
      g.fillRoundedRect(0, 2, paddleW, paddleInnerH, 6);
      g.fillStyle(COLORS.paddle, 1);
      g.fillRoundedRect(0, 0, paddleW, paddleInnerH, 6);
      g.generateTexture('paddle', paddleW, paddleTexH);

      function drawBlockTexture(key, fill, border, extra) {
        const r = blockProceduralRadii(innerW, innerH);
        g.clear();
        g.fillStyle(border, 1);
        g.fillRoundedRect(pad, pad, innerW, innerH, r.outer);
        g.fillStyle(fill, 1);
        g.fillRoundedRect(pad + 2, pad + 2, innerW - 4, innerH - 4, r.inner);
        if (extra) extra(g, pad, innerW, innerH, r);
        g.generateTexture(key, cellW, cellH);
      }

      drawBlockTexture('block_normal', COLORS.blockNormal, COLORS.blockNormalBorder);
      drawBlockTexture('block_gray', COLORS.blockGray, COLORS.blockGrayBorder, (gfx, px, w, h) => {
        const starR = normalStarOuterRadius(w, h);
        if (typeof drawMutedGrayStarPhaser === 'function') {
          drawMutedGrayStarPhaser(gfx, px + w / 2, px + h / 2, starR);
        }
      });
      bakePowerBlockTextures(scene, cellW, cellH, g);

      drawBlockTexture('block_hidden', COLORS.blockHidden, COLORS.blockHiddenBorder, (gfx, px, w, h, r) => {
        if (typeof drawHiddenPanelPhaser === 'function') {
          drawHiddenPanelPhaser(gfx, px, w, h, r);
        }
      });

      {
        const hiddenW = 2 * cellW - pad;
        const hiddenH = 2 * cellH - pad;
        const hiddenInnerW = hiddenW - pad * 2;
        const hiddenInnerH = hiddenH - pad * 2;
        const r = blockProceduralRadii(hiddenInnerW, hiddenInnerH);
        g.clear();
        if (typeof drawHiddenPanelPhaser === 'function') {
          drawHiddenPanelPhaser(g, pad, hiddenInnerW, hiddenInnerH, r);
        } else {
          g.fillStyle(COLORS.blockHidden, 1);
          g.fillRoundedRect(pad, pad, hiddenInnerW, hiddenInnerH, r.outer);
        }
        g.generateTexture('block_hidden_2x2', hiddenW, hiddenH);
      }

      {
        g.clear();
        const spikeSidePad = 2;
        const spikeTopPad = 2;
        const spikeInnerW = cellW - spikeSidePad * 2;
        const spikeInnerH = cellH - spikeTopPad;
        drawCuteSpikePhaser(g, spikeSidePad, spikeInnerW, spikeInnerH);
        g.generateTexture('block_spike', cellW, cellH);
      }

      // Indestructible (steel + X; never breaks)
      drawBlockTexture('block_indestructible', 0x44aaff, 0x0066cc, (gfx, px, w, h) => {
        gfx.lineStyle(Math.max(2, Math.floor(Math.min(w, h) * 0.08)), 0x003366, 0.95);
        gfx.lineBetween(px + 4, px + 4, px + w - 4, px + h - 4);
        gfx.lineBetween(px + w - 4, px + 4, px + 4, px + h - 4);
      });

      // Score block — 2×2 footprint (3D overlay replaces with orange puff + star)
      {
        const scoreW = 2 * cellW - pad;
        const scoreH = 2 * cellH - pad;
        const scoreInnerW = scoreW - pad * 2;
        const scoreInnerH = scoreH - pad * 2;
        const r = blockProceduralRadii(scoreInnerW, scoreInnerH);
        g.clear();
        g.fillStyle(0xcc5500, 1);
        g.fillRoundedRect(pad, pad, scoreInnerW, scoreInnerH, r.outer);
        g.fillStyle(0xff8800, 1);
        g.fillRoundedRect(pad + 2, pad + 2, scoreInnerW - 4, scoreInnerH - 4, r.inner);
        const starR = Math.min(scoreInnerW, scoreInnerH) * 0.22;
        const starCx = pad + scoreInnerW / 2;
        const starCy = pad + scoreInnerH / 2;
        if (typeof drawDebossedNormalStarPhaser === 'function') {
          drawDebossedNormalStarPhaser(g, starCx, starCy, starR);
        } else {
          g.fillStyle(0xffee44, 0.9);
          g.fillCircle(starCx, starCy, starR * 0.55);
        }
        g.generateTexture('block_score', scoreW, scoreH);
      }

      drawBlockTexture('block_bonus', 0xffee22, 0xff9900, (gfx, px, w, h, r) => {
        gfx.fillStyle(0xffffff, 0.95);
        gfx.fillCircle(px + w / 2, px + h * 0.44, Math.min(w, h) * 0.14);
        gfx.lineStyle(1, 0xffffff, 0.5);
        gfx.strokeRoundedRect(px + w * 0.28, px + h * 0.62, w * 0.44, h * 0.18, r.detail);
      });

      // Life icon (procedural); ball face loaded in preload()
      g.clear();
      g.fillStyle(COLORS.ball, 1);
      g.fillCircle(8, 8, 8);
      g.generateTexture('life_icon', 16, 16);

      if (!scene.textures.exists(BALL_TEXTURE.neutral)) {
        const ballSize = 64;
        g.clear();
        g.fillStyle(COLORS.ball, 1);
        g.fillCircle(ballSize / 2, ballSize / 2, ballSize / 2 - 2);
        g.fillStyle(COLORS.ballHighlight, 0.55);
        g.fillCircle(ballSize * 0.35, ballSize * 0.35, ballSize * 0.12);
        g.generateTexture(BALL_TEXTURE.neutral, ballSize, ballSize);
      }

      if (!scene.textures.exists(BALL_TEXTURE.determined)) {
        const ballSize = 64;
        g.clear();
        g.fillStyle(0xff8800, 1);
        g.fillCircle(ballSize / 2, ballSize / 2, ballSize / 2 - 2);
        g.fillStyle(COLORS.accent, 0.85);
        g.fillCircle(ballSize * 0.35, ballSize * 0.35, ballSize * 0.12);
        g.lineStyle(2, 0x3a0080, 0.55);
        g.strokeCircle(ballSize / 2, ballSize / 2, ballSize / 2 - 3);
        g.generateTexture(BALL_TEXTURE.determined, ballSize, ballSize);
      }

      generateHudAvatarTextures(scene, 48);

      // Enemy (one cell)
      g.clear();
      g.fillStyle(COLORS.enemyDark, 1);
      g.fillEllipse(cellW / 2, cellH * 0.65, innerW * 0.85, innerH * 0.7);
      g.fillStyle(COLORS.enemy, 1);
      g.fillEllipse(cellW / 2, cellH * 0.58, innerW * 0.8, innerH * 0.65);
      g.fillStyle(0xffffff, 1);
      g.fillCircle(cellW * 0.35, cellH * 0.42, Math.max(3, cellW * 0.1));
      g.fillCircle(cellW * 0.65, cellH * 0.42, Math.max(3, cellW * 0.1));
      g.fillStyle(0x003366, 1);
      g.fillCircle(cellW * 0.35, cellH * 0.42, Math.max(2, cellW * 0.05));
      g.fillCircle(cellW * 0.65, cellH * 0.42, Math.max(2, cellW * 0.05));
      g.fillStyle(0x003366, 0.85);
      g.fillEllipse(cellW / 2, cellH * 0.72, cellW * 0.15, cellH * 0.1);
      g.generateTexture('enemy', cellW, cellH);

      generateItemTextures(scene, cellW, cellH, g);

      // Particle spark (ball lose, enemies)
      g.clear();
      g.fillStyle(0xffffff, 1);
      g.fillCircle(4, 4, 4);
      g.generateTexture('particle', 8, 8);

      const clayAtlasH = 12;
      const clayFrames = [
        { name: 'chunk_a', x: 0, w: 12, h: 10 },
        { name: 'chunk_b', x: 14, w: 10, h: 12 },
        { name: 'chunk_c', x: 26, w: 14, h: 9 },
        { name: 'chunk_d', x: 42, w: 7, h: 7 },
      ];
      const clayAtlasW = 50;

      function drawClayChunkAt(ox, oy, w, h) {
        g.fillStyle(0xf0e6d8, 1);
        const cx = ox + w / 2;
        const cy = oy + h / 2;
        g.fillCircle(cx, cy, Math.min(w, h) * 0.44);
        g.fillCircle(cx - w * 0.22, cy + h * 0.12, Math.min(w, h) * 0.3);
        g.fillCircle(cx + w * 0.2, cy - h * 0.1, Math.min(w, h) * 0.28);
        g.fillCircle(cx + w * 0.08, cy + h * 0.22, Math.min(w, h) * 0.22);
        g.fillStyle(0x000000, 0.12);
        g.fillCircle(cx - 1, cy + 1, Math.max(1, Math.min(w, h) * 0.08));
        g.fillStyle(0xffffff, 0.15);
        g.fillCircle(cx + 1, cy - 2, Math.max(1, Math.min(w, h) * 0.06));
      }

      g.clear();
      for (const f of clayFrames) {
        const oy = Math.floor((clayAtlasH - f.h) / 2);
        drawClayChunkAt(f.x, oy, f.w, f.h);
      }
      g.generateTexture('clay_debris', clayAtlasW, clayAtlasH);
      const clayTex = scene.textures.get('clay_debris');
      for (const f of clayFrames) {
        const oy = Math.floor((clayAtlasH - f.h) / 2);
        clayTex.add(f.name, 0, f.x, oy, f.w, f.h);
      }

      // Blue slime blobs (ball trail — lingers on the playfield)
      const slimeAtlasH = 16;
      const slimeFrames = [
        { name: 'slime_a', x: 0, w: 14, h: 14 },
        { name: 'slime_b', x: 16, w: 12, h: 13 },
        { name: 'slime_c', x: 30, w: 15, h: 11 },
        { name: 'slime_d', x: 47, w: 10, h: 10 },
        { name: 'slime_e', x: 59, w: 8, h: 8 },
      ];
      const slimeAtlasW = 68;

      function drawSlimeBlobAt(ox, oy, w, h) {
        const cx = ox + w / 2;
        const cy = oy + h / 2;
        const m = Math.min(w, h);
        g.fillStyle(0x1155aa, 0.55);
        g.fillCircle(cx + 1, cy + 2, m * 0.46);
        g.fillStyle(0x2288dd, 1);
        g.fillCircle(cx, cy, m * 0.42);
        g.fillCircle(cx - w * 0.2, cy + h * 0.1, m * 0.3);
        g.fillCircle(cx + w * 0.18, cy - h * 0.08, m * 0.27);
        g.fillCircle(cx + w * 0.06, cy + h * 0.2, m * 0.22);
        g.fillStyle(0x55bbff, 0.75);
        g.fillCircle(cx - w * 0.14, cy - h * 0.16, m * 0.14);
        g.fillStyle(0xaaddff, 0.45);
        g.fillCircle(cx - w * 0.1, cy - h * 0.2, m * 0.07);
      }

      g.clear();
      for (const f of slimeFrames) {
        const oy = Math.floor((slimeAtlasH - f.h) / 2);
        drawSlimeBlobAt(f.x, oy, f.w, f.h);
      }
      g.generateTexture('slime_trail', slimeAtlasW, slimeAtlasH);
      const slimeTex = scene.textures.get('slime_trail');
      for (const f of slimeFrames) {
        const oy = Math.floor((slimeAtlasH - f.h) / 2);
        slimeTex.add(f.name, 0, f.x, oy, f.w, f.h);
      }

      // Soft ring bloom for power → normal ball cooldown
      if (!scene.textures.exists('power_cool_ring')) {
        const ringSize = 40;
        const ringTex = scene.textures.createCanvas('power_cool_ring', ringSize, ringSize);
        const rctx = ringTex.getContext();
        const rc = ringSize / 2;
        const outer = rc - 1;
        const grad = rctx.createRadialGradient(rc, rc, rc * 0.42, rc, rc, outer);
        grad.addColorStop(0, 'rgba(255,255,255,0)');
        grad.addColorStop(0.5, 'rgba(255,255,240,0.92)');
        grad.addColorStop(0.78, 'rgba(255,220,120,0.45)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        rctx.fillStyle = grad;
        rctx.beginPath();
        rctx.arc(rc, rc, outer, 0, Math.PI * 2);
        rctx.fill();
        ringTex.refresh();
      }

      g.destroy();
    }

    const ITEM_CATEGORY_COLORS = {
      [ITEM_CATEGORY.food]: { fill: 0xff5566, border: 0xcc2244 },
      [ITEM_CATEGORY.powerUp]: { fill: 0x22ee88, border: 0x00aa55 },
      [ITEM_CATEGORY.copyAbility]: { fill: 0x4488ff, border: 0x2244cc },
      [ITEM_CATEGORY.life]: { fill: 0xcc66ff, border: 0x8822cc },
    };

    function uniqueLevelItemIds() {
      const spawns = ACTIVE_LEVEL?.items || [];
      return [...new Set(spawns.map((s) => s.type).filter(Boolean))];
    }

    /** Procedural item icons for types without PNG art in preload. */
    function fillStar(g, cx, cy, outerR, innerR, points) {
      g.beginPath();
      for (let i = 0; i < points * 2; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const angle = -Math.PI / 2 + (i * Math.PI) / points;
        const x = cx + r * Math.cos(angle);
        const y = cy + r * Math.sin(angle);
        if (i === 0) g.moveTo(x, y);
        else g.lineTo(x, y);
      }
      g.closePath();
      g.fillPath();
    }

    function generateItemTextures(scene, cellW, cellH, g) {
      const ids = uniqueLevelItemIds();
      if (!ids.length) return;

      const pad = 2;

      for (const id of ids) {
        const key = getItemTextureKey(id);
        if (scene.textures.exists(key)) continue;

        const def = getItemDef(id);
        const foot = getItemFootprint(id);
        const colors = ITEM_CATEGORY_COLORS[def?.category] || { fill: 0x888888, border: 0x555555 };
        const texW = foot.colSpan * cellW - pad;
        const texH = foot.rowSpan * cellH - pad;

        g.clear();
        if (id === 'item_bonus_chance') {
          const cx = texW * 0.5;
          const cy = texH * 0.5;
          const circleR = Math.min(texW, texH) * 0.42;
          g.fillStyle(0x22ee88, 1);
          g.fillCircle(cx, cy, circleR);
          g.fillStyle(0xffee44, 1);
          fillStar(g, cx, cy, circleR * 0.55, circleR * 0.55 * 0.42, 5);
        } else {
          const size = Math.max(8, Math.min(texW, texH) - 4);
          g.fillStyle(colors.border, 1);
          g.fillRoundedRect(0, 0, size, size, 4);
          g.fillStyle(colors.fill, 1);
          g.fillRoundedRect(2, 2, size - 4, size - 4, 3);
          g.fillStyle(0xffffff, 0.35);
          g.fillCircle(size * 0.72, size * 0.28, Math.max(2, size * 0.1));
        }
        g.generateTexture(key, texW, texH);
      }
    }

    // =============================================================================
    // MAIN SCENE
    // =============================================================================

    class GameScene extends Phaser.Scene {
      constructor() {
        super({ key: 'GameScene' });
      }

      preload() {
        this.load.image(BALL_TEXTURE.neutral, BALL_FACE_ASSET);
        this.load.image(BALL_TEXTURE.determined, BALL_POWER_FACE_ASSET);
      }

      /** Match inscribed cell ball size (setTexture resets to native image dimensions). */
      syncBallDisplaySize(worldRadius) {
        if (!this.ball || this.ballRadius == null) return;
        const diameter = this.ballRadius * 2;
        this.ball.setDisplaySize(diameter, diameter);
        this.ballBaseScale = this.ball.scaleX;
        this.syncBallPhysicsBody(worldRadius);
      }

      /** Arcade circle is scaled with the sprite — divide by scaleX so world radius matches art. */
      syncBallPhysicsBody(worldRadius) {
        if (!this.ball?.body || this.ballRadius == null) return;
        const worldR = worldRadius ?? this.ballRadius;
        const s = Math.abs(this.ball.scaleX);
        if (!s) return;
        this.ball.body.setCircle(worldR / s);
      }

      ballPowerScale() {
        return this.ballBaseScale * POWER_BALL.scale;
      }

      updateBallSpin(delta) {
        if (!this.ball?.active || this.ballOnPaddle || !this.ball.body?.moves) return;

        const vx = this.ball.body.velocity.x;
        const vy = this.ball.body.velocity.y;
        const speed = Math.hypot(vx, vy);
        if (speed < 8) return;

        const r = this.ball.displayWidth * 0.5;
        if (r <= 0) return;

        const omega = ballRollAngularSpeed(speed, r);
        const rollSign = ballRollSign(vx, vy);
        this.ball.rotation += rollSign * omega * (delta / 1000);
      }

      /** Neutral smile by default; surprise face in power mode. */
      applyBallTexture() {
        if (!this.ball?.active) return;
        const key = this.ballPowerMode ? BALL_TEXTURE.determined : BALL_TEXTURE.neutral;
        if (this.textures.exists(key)) {
          this.ball.setTexture(key);
        }
        this.syncBallDisplaySize();
        this.ball.setAlpha(1);
        this.ball.clearTint();
      }

      clearPaddleTweenRefs() {
        this.paddleChargeScaleTween = null;
        this.paddleChargeShakeTween = null;
      }

      killPaddleTweens() {
        if (this.paddle) this.tweens.killTweensOf(this.paddle);
        this.clearPaddleTweenRefs();
      }

      finishPaddleSpring() {
        this.paddleSpringing = false;
        this.killPaddleTweens();
        this.resetPaddleVisual();
      }

      preparePaddleForCharge() {
        if (this.paddleSpringing) {
          this.finishPaddleSpring();
        } else {
          this.killPaddleTweens();
          this.resetPaddleVisual();
        }
      }

      isSceneActive() {
        return Boolean(this.sys?.isActive());
      }

      safeStopTween(tween) {
        if (!tween) return;
        try {
          if (typeof tween.isPlaying === 'function' && tween.isPlaying()) {
            tween.stop();
          }
        } catch (err) {
          bbError('safeStopTween', err);
        }
      }

      create() {
        bbLog('create() start');
        this.gameState = 'playing'; // playing | levelClear | gameOver
        this.score = 0;
        this.ballLaunched = false;
        this.ballOnPaddle = true;
        this.powerBounceQueued = false;
        this.powerBounceQueuedAt = 0;
        this.powerBounceActive = false;
        this.powerBounceMultiplier = false;
        this.ballPowerMode = false;
        this.ballPowerCooling = false;
        this.powerBallTimer = null;
        this.powerCoolRingEvent = null;
        this.powerCoolTintTween = null;
        this.blocksRemaining = 0;
        this.dragging = false;
        this.pointerWasDragging = false;
        this.isLosingBall = false;
        this.paddleCharging = false;
        this.paddleSpringing = false;
        this.paddleChargeScaleTween = null;
        this.paddleChargeShakeTween = null;
        this.bottomHalfTouchThisStroke = false;
        this.pendingPowerSpring = false;
        this.bonusChanceActive = false;
        this.bonusChanceEndsAt = 0;

        this.launchAimIndex = 0;
        this.launchAimDirection = 1;
        this.launchAimTickEvent = null;
        this.aimArrowGfx = null;
        this.launchChargeActive = false;
        this.launchChargeTween = null;
        this.blockDebrisTintCache = new Map();
        this.threeOverlay = null;

        const { width, height } = this.scale;
        this.level = ACTIVE_LEVEL;
        this.levelGrid = createLevelGrid(this.level, height, width);
        this.lives = this.level.meta?.lives ?? 3;

        // Parallax black-lined grid background
        createParallaxGridBackground(this, width, height);
        drawGameFrameBezelFill(this, this.levelGrid, width, height);

        if (DEV_BORDERS) {
          const frame = this.add.graphics();
          frame.lineStyle(4, 0xffee44, 0.75);
          frame.strokeRect(8, 8, width - 16, height - 16);
        }

        generateTextures(this, this.levelGrid.config.cellWidth, this.levelGrid.config.cellHeight);
        this.ballRadius = ballRadiusForCell(this.levelGrid);
        this.gridCellH = this.levelGrid.config.cellHeight;

        this.initThreeOverlay();

        // Physics world — grid rows only (spikes sit above the bottom border strip)
        const playGridBounds = this.levelGrid.getPlayGridBounds();
        this.physics.world.setBounds(
          playGridBounds.x,
          playGridBounds.y,
          playGridBounds.width,
          playGridBounds.height
        );
        this.physics.world.setBoundsCollision(true, true, true, true);

        const { playGridBottom, playBottomBorder } = this.levelGrid;
        const floorW = this.levelGrid.config.cols * this.levelGrid.config.cellWidth;
        const floorX = this.levelGrid.config.originX;
        this.playFloorGfx = this.add.graphics().setDepth(3);
        this.playFloorGfx.fillStyle(0x000000, 1);
        const floorRadius = Math.min(3, playBottomBorder / 2);
        this.playFloorGfx.fillRoundedRect(floorX, playGridBottom, floorW, playBottomBorder, floorRadius);

        this.createBlocks();
        this.createEnemies();
        this.createItems();
        this.createPaddle();
        this.createBall();
        this.setupCollisions();
        this.createUI();
        this.setupInput();

        this.scale.on('resize', () => {
          if (!document.getElementById('game-modal-overlay')?.hidden) {
            syncGameModalOverlayLayout(this);
          }
        });
        this.events.once('shutdown', hideGameModalOverlay);

        if (SHOW_LEVEL_GRID) {
          drawLevelGridDebug(this, this.levelGrid, this.level);
        }

        if (DEV_BORDERS) {
          drawDevViewBorders(this, this.levelGrid, width, height);
        }

        this.updateUI();
        bbLog('create() complete', { blocks: this.blocksRemaining, lives: this.lives });
      }

      initThreeOverlay() {
        if (!USE_3D_OVERLAY || typeof window.__blockBallThreeOverlay !== 'function') return;
        this.threeOverlay = window.__blockBallThreeOverlay({
          width: this.scale.width,
          height: this.scale.height,
          parent: document.getElementById('game-container'),
          getPhaserCanvas: () => this.game.canvas,
          getLayout: () => {
            const s = this.scale;
            const phaserCanvas = this.game.canvas;
            const parentEl = document.getElementById('game-container');
            if (!phaserCanvas || !parentEl) return null;
            s.updateBounds?.();
            const canvasRect = phaserCanvas.getBoundingClientRect();
            const parentRect = parentEl.getBoundingClientRect();
            return {
              gameW: s.gameSize.width,
              gameH: s.gameSize.height,
              displayW: canvasRect.width,
              displayH: canvasRect.height,
              offsetLeft: canvasRect.left - parentRect.left,
              offsetTop: canvasRect.top - parentRect.top,
            };
          },
          getCamera: () => {
            const cam = this.cameras?.main;
            if (!cam) return null;
            return {
              scrollX: cam.scrollX,
              scrollY: cam.scrollY,
              zoom: cam.zoom,
              rotation: cam.rotation,
              shakeX: cam._shakeOffsetX ?? cam.shakeOffsetX ?? 0,
              shakeY: cam._shakeOffsetY ?? cam.shakeOffsetY ?? 0,
            };
          },
        });
        this.threeOverlay.bindPhaserScene(this);
        this.threeOverlay.start();
        this.scale.on('resize', () => this.threeOverlay?.syncLayout());
        bbLog('3D overlay enabled');
      }

      registerThreeBlock(block) {
        if (this.threeOverlay?.registerBlock(block)) return;
        this.attachNormalBlockStar(block);
        this.attachGrayBlockStar(block);
      }

      attachNormalBlockStar(block) {
        if (!block?.active || !isNormalBlockType(block.getData('typeId'))) return;
        if (block.getData('starGfx')?.active) return;

        const col = block.getData('gridCol') ?? 0;
        const row = block.getData('gridRow') ?? 0;
        block.setData('starPhase', normalStarTickerPhase(col, row));

        const gfx = this.add.graphics();
        gfx.setDepth((block.depth ?? 5) + 0.2);
        block.setData('starGfx', gfx);
        this.redrawNormalBlockStarGfx(block);
        block.once('destroy', () => {
          const g = block.getData('starGfx');
          if (g?.active) g.destroy();
          block.setData('starGfx', null);
        });
      }

      redrawNormalBlockStarGfx(block) {
        const gfx = block.getData('starGfx');
        if (!gfx?.active) return;
        gfx.clear();
        const pad = 4;
        const outerR = normalStarOuterRadius(
          Math.max(8, block.displayWidth - pad),
          Math.max(8, block.displayHeight - pad)
        );
        drawDebossedNormalStarPhaser(gfx, 0, 0, outerR);
      }

      attachGrayBlockStar(block) {
        if (!block?.active || !isGrayBlockType(block.getData('typeId'))) return;
        if (block.getData('grayStarGfx')?.active) return;

        const gfx = this.add.graphics();
        gfx.setDepth((block.depth ?? 5) + 0.2);
        block.setData('grayStarGfx', gfx);
        this.redrawGrayBlockStarGfx(block);
        block.once('destroy', () => {
          const g = block.getData('grayStarGfx');
          if (g?.active) g.destroy();
          block.setData('grayStarGfx', null);
        });
      }

      redrawGrayBlockStarGfx(block) {
        const gfx = block.getData('grayStarGfx');
        if (!gfx?.active) return;
        gfx.clear();
        const pad = 4;
        const outerR = normalStarOuterRadius(
          Math.max(8, block.displayWidth - pad),
          Math.max(8, block.displayHeight - pad)
        );
        if (typeof drawMutedGrayStarPhaser === 'function') {
          drawMutedGrayStarPhaser(gfx, 0, 0, outerR);
        }
      }

      updateNormalBlockStars(time) {
        if (!this.blocks) return;
        for (const block of this.blocks.getChildren()) {
          const gfx = block.getData('starGfx');
          if (!gfx?.active || !block.active) continue;
          gfx.setPosition(block.x, block.y);
          const phase = block.getData('starPhase') || 0;
          gfx.setRotation(normalStarTickerAngle(time, NORMAL_STAR_TICK_MS, phase));
        }
      }

      updateGrayBlockStars() {
        if (!this.blocks) return;
        for (const block of this.blocks.getChildren()) {
          const gfx = block.getData('grayStarGfx');
          if (!gfx?.active || !block.active) continue;
          gfx.setPosition(block.x, block.y);
        }
      }

      // ---------------------------------------------------------------------------
      // Level geometry
      // ---------------------------------------------------------------------------

      createBlocks() {
        const cells = ensurePlayBlockCells(this.level, this.levelGrid);

        this.blocks = this.physics.add.staticGroup();
        this.blocksRemaining = 0;

        const spawnBlock = (gridCol, gridRow, cell) => {
          if (isBlockExtensionCell(cell)) return;
          const typeId = getBlockTypeFromCell(cell);
          if (!typeId) return;
          const def = getBlockDef(typeId);
          const { colSpan, rowSpan } = getBlockFootprint(typeId);
          const isLong = colSpan > 1 || rowSpan > 1;
          const { x, y } = isLong
            ? this.levelGrid.cellSpanCenter(gridCol, gridRow, colSpan, rowSpan)
            : this.levelGrid.cellCenter(gridCol, gridRow);

          const block = this.blocks.create(x, y, def.texture);
          const isPower = isPowerBlockType(typeId);
          if (isLong || isPower) {
            fitEntityToCellSpan(block, this.levelGrid, colSpan, rowSpan);
          } else if (def.isHazard) {
            fitSpikeToCellBottom(block, this.levelGrid, gridCol, gridRow);
          } else {
            fitEntityToCell(block, this.levelGrid);
          }
          block.refreshBody();
          block.setDepth(def.isHazard ? 10 : 5);
          block.setData('typeId', typeId);
          block.setData('points', def.points);
          block.setData('isPower', def.powerOnly);
          block.setData('isHazard', Boolean(def.isHazard));
          block.setData('gridCol', gridCol);
          block.setData('gridRow', gridRow);
          block.setData('colSpan', colSpan);
          block.setData('rowSpan', rowSpan);
          const countsClear = blockCountsTowardLevelClear(typeId);
          block.setData('countsTowardClear', countsClear);
          if (typeId === 'score') block.setData('scoreHits', 0);
          if (typeId === 'hidden' || typeId === 'hidden_2x2') {
            block.setData('hiddenRevealCell', getHiddenRevealCell(this.level, gridCol, gridRow));
            block.setData('hiddenRevealed', false);
            block.setAlpha(0);
          }
          if (countsClear) this.blocksRemaining++;
          this.registerThreeBlock(block);
        };

        for (let row = 0; row < cells.length; row++) {
          for (let col = 0; col < cells[row].length; col++) {
            const cell = cells[row][col];
            if (cell === 0) continue;
            spawnBlock(col, row, cell);
          }
        }
      }

      createEnemies() {
        const spawns = this.level.enemies || [];

        this.enemies = this.physics.add.group();
        spawns.forEach((spawn, i) => {
          const { x, y } = this.levelGrid.cellCenter(spawn.col, spawn.row);
          this.spawnEnemy(spawn.type, x, y, i);
        });
      }

      applyItemFloatTween(item, baseY, spawn, index) {
        const amp = Math.max(2, this.levelGrid.config.cellHeight * ITEM_FLOAT.amplitudeFrac);
        this.tweens.add({
          targets: item,
          y: baseY - amp,
          duration: ITEM_FLOAT.durationBase + (index % 4) * ITEM_FLOAT.durationStep,
          ease: 'Sine.easeInOut',
          yoyo: true,
          repeat: -1,
          delay: ((spawn.col * 3 + spawn.row) % 6) * ITEM_FLOAT.delayStep,
        });
      }

      createItems() {
        const spawns = this.level.items || [];
        this.levelItems = this.add.group();

        spawns.forEach((spawn, index) => {
          const key = getItemTextureKey(spawn.type);
          if (!this.textures.exists(key)) {
            bbLog('createItems: missing texture', spawn.type);
            return;
          }
          const foot = getItemFootprint(spawn.type);
          const { x, y } = this.levelGrid.cellSpanCenter(
            spawn.col,
            spawn.row,
            foot.colSpan,
            foot.rowSpan
          );
          const item = this.add.image(x, y, key);
          this.physics.add.existing(item);
          item.body.setImmovable(true);
          item.body.allowGravity = false;
          if (foot.colSpan > 1 || foot.rowSpan > 1) {
            fitEntityToCellSpan(item, this.levelGrid, foot.colSpan, foot.rowSpan);
          } else {
            fitEntityToCell(item, this.levelGrid, { contain: true });
          }
          item.setDepth(6);
          item.setData('typeId', spawn.type);
          item.setData('gridCol', spawn.col);
          item.setData('gridRow', spawn.row);
          item.setData('colSpan', foot.colSpan);
          item.setData('rowSpan', foot.rowSpan);
          item.setData('baseY', y);
          this.levelItems.add(item);
          this.applyItemFloatTween(item, y, spawn, index);
          this.threeOverlay?.registerItem(item);
        });

        bbLog('createItems', { count: this.levelItems.getLength() });
      }

      spawnEnemy(typeId, x, y, index) {
        const def = getEnemyDef(typeId);
        const enemy = this.enemies.create(x, y, def.texture);
        fitEntityToCell(enemy, this.levelGrid, { circle: true });
        enemy.setBounce(1);
        enemy.setCollideWorldBounds(true);
        enemy.setImmovable(true);
        enemy.body.allowGravity = false;
        enemy.setDepth(7);
        enemy.setData('typeId', typeId);
        enemy.setData('hp', def.hp);
        enemy.setData('maxHp', def.maxHp);
        enemy.setData('points', def.points);
        enemy.setData('drop', def.drop);

        this.applyEnemyMovement(enemy, def, index, x, y);
        return enemy;
      }

      applyEnemyMovement(enemy, def, index, startX, startY) {
        switch (def.movement) {
          case 'erratic_float':
          default:
            this.tweens.add({
              targets: enemy,
              x: startX + (index % 2 === 0 ? this.levelGrid.config.cellWidth : -this.levelGrid.config.cellWidth),
              duration: 2200 + index * 400,
              yoyo: true,
              repeat: -1,
              ease: 'Sine.easeInOut',
            });
            break;
        }
        enemy.setData('baseX', startX);
      }

      createPaddle() {
        const paddleDef = this.level.paddle || { col: 4, colSpan: 2, rowFromBottom: 2 };
        const colSpan = paddleDef.colSpan ?? 2;
        const paddleRow = resolveGridRow(this.levelGrid, paddleDef);
        const { x: paddleX, y: paddleY } = this.levelGrid.cellSpanCenter(
          paddleDef.col,
          paddleRow,
          colSpan,
          1
        );
        const { cellWidth, cellHeight } = this.levelGrid.config;
        const paddleSize = getPaddleDisplaySize(cellWidth, cellHeight, colSpan);
        const paddleKey = 'paddle';

        this.paddle = this.physics.add.image(paddleX, paddleY, paddleKey);
        this.paddle.setDisplaySize(paddleSize.width, paddleSize.height);
        this.paddleBaseW = paddleSize.width;
        this.paddleBaseH = paddleSize.height;
        if (this.paddle.body) {
          this.paddle.body.setSize(paddleSize.width, paddleSize.height);
        }
        this.paddle.setImmovable(true);
        this.paddle.body.allowGravity = false;
        this.paddle.setCollideWorldBounds(true);
        this.paddle.setDepth(10);
        this.paddle.setOrigin(0.5, 0.5);
        this.threeOverlay?.registerPaddle(this.paddle);
      }

      createBall() {
        this.ball = this.physics.add.image(this.paddle.x, this.paddle.y, BALL_TEXTURE.neutral);
        this.applyBallTexture();
        this.ball.setBounce(1);
        this.ball.setCollideWorldBounds(true);
        this.ball.body.onWorldBounds = true;
        this.ball.setDepth(11);
        this.ball.setOrigin(0.5, 0.5);
        this.ball.body.allowGravity = false;
        this.physics.world.gravity.y = 0;

        this.createBallTrail();
        this.attachBallToPaddle(false);
        this.threeOverlay?.registerBall(this.ball);
      }

      createBallTrail() {
        this.ballTrail = this.add.particles(0, 0, 'slime_trail', {
          ...this.ballTrailBaseConfig(false),
          emitting: false,
        });
        this.ballTrail.setDepth(8);
        this.ballTrail.startFollow(this.ball);
        this._ballTrailPowered = false;
      }

      ballTrailBaseConfig(powered) {
        const diam = this.ball?.active ? this.ball.displayWidth : this.ballRadius * 2;
        const scaleMul = powered ? BALL_TRAIL.scaleMulPower : BALL_TRAIL.scaleMul;
        const base = Math.max(0.12, (diam / 16) * scaleMul);
        return {
          frame: ['slime_a', 'slime_b', 'slime_c', 'slime_d', 'slime_e'],
          lifespan: powered ? BALL_TRAIL.lifespanPower : BALL_TRAIL.lifespan,
          scale: { start: base * 0.85, end: base * 1.12, random: true },
          alpha: { start: 0.9, end: 0.38 },
          speed: { min: 0, max: 14 },
          angle: { min: 0, max: 360 },
          rotate: { min: 0, max: 360 },
          gravityY: powered ? BALL_TRAIL.gravityYPower : BALL_TRAIL.gravityY,
          tint: powered ? BALL_TRAIL.tintPower : BALL_TRAIL.tint,
          blendMode: 'NORMAL',
          frequency: powered ? BALL_TRAIL.frequencyPower : BALL_TRAIL.frequency,
          quantity: 1,
          maxParticles: BALL_TRAIL.maxParticles,
        };
      }

      /** Reconfigure trail for normal vs power (not every frame — loadConfig each frame broke emission). */
      syncBallTrailStyle() {
        if (!this.ballTrail) return;
        const powered = !!this.ballPowerMode;
        if (this._ballTrailPowered !== powered) {
          this._ballTrailPowered = powered;
          const wasEmitting = this.ballTrail.emitting;
          this.ballTrail.setConfig(this.ballTrailBaseConfig(powered));
          this.ballTrail.startFollow(this.ball);
          if (wasEmitting) this.ballTrail.start();
        }
      }

      startBallTrail() {
        if (!this.ballTrail || !this.ball?.active) return;
        this.syncBallTrailStyle();
        if (!this.ballTrail.emitting) this.ballTrail.start();
      }

      stopBallTrail() {
        if (this.ballTrail?.emitting) this.ballTrail.stop();
      }

      updateBallTrail() {
        if (!this.ballTrail || !this.ball?.active || this.ballOnPaddle) return;
        const speed = Math.hypot(this.ball.body.velocity.x, this.ball.body.velocity.y);
        if (speed < BALL_TRAIL.minSpeed) {
          this.stopBallTrail();
          return;
        }
        this.syncBallTrailStyle();
        if (!this.ballTrail.emitting) this.ballTrail.start();
      }

      attachBallToPaddle(deferAim = false) {
        this.ballOnPaddle = true;
        this.ballLaunched = false;
        this.pendingPowerSpring = false;
        this.ball.body.setVelocity(0, 0);
        this.ball.body.moves = false;
        this.clearBallPowerState();
        this.stopBallTrail();
        this.finishPaddleSpring();
        this.tweens.killTweensOf(this.ball);
        this.stopLaunchCharge(true);
        this.ball.rotation = 0;
        if (this.ballBaseScale != null) {
          this.ball.setScale(this.ballBaseScale);
          this.syncBallPhysicsBody(this.ballRadius);
        }
        this.syncBallToPaddle();
        this.launchAimIndex = 0;
        this.launchAimDirection = 1;
        if (deferAim) {
          this.stopLaunchAimCycle();
        } else {
          this.startLaunchAimCycle();
        }
      }

      startLaunchAimCycle() {
        this.stopLaunchAimCycle();
        if (!this.aimArrowGfx) {
          this.aimArrowGfx = this.add.graphics().setDepth(12).setScrollFactor(0);
        }
        this.launchAimTickEvent = this.time.addEvent({
          delay: LAUNCH_AIM_TICK_MS,
          loop: true,
          callback: () => {
            if (!this.ballOnPaddle || this.gameState !== 'playing' || this.isLosingBall) return;
            let next = this.launchAimIndex + this.launchAimDirection;
            if (next < 0 || next >= LAUNCH_AIM_DIRS.length) {
              this.launchAimDirection *= -1;
              next = this.launchAimIndex + this.launchAimDirection;
            }
            this.launchAimIndex = next;
            this.redrawAimArrow();
          },
        });
        this.redrawAimArrow();
      }

      stopLaunchAimCycle() {
        if (this.launchAimTickEvent) {
          this.launchAimTickEvent.destroy();
          this.launchAimTickEvent = null;
        }
        if (this.aimArrowGfx) {
          this.aimArrowGfx.clear();
        }
      }

      redrawAimArrow() {
        if (!this.aimArrowGfx || !this.ballOnPaddle || !this.ball?.active || this.isLosingBall) {
          if (this.aimArrowGfx) this.aimArrowGfx.clear();
          return;
        }
        const d = LAUNCH_AIM_DIRS[this.launchAimIndex];
        const bx = this.ball.x;
        const by = this.ball.y;
        const shaftLen = this.ballRadius + 36;
        const tipX = bx + d.vx * shaftLen;
        const tipY = by + d.vy * shaftLen;
        const px = -d.vy;
        const py = d.vx;
        const hw = 7;

        this.aimArrowGfx.clear();
        this.aimArrowGfx.lineStyle(4, 0xffee44, 1);
        this.aimArrowGfx.beginPath();
        this.aimArrowGfx.moveTo(bx + d.vx * (this.ballRadius + 4), by + d.vy * (this.ballRadius + 4));
        this.aimArrowGfx.lineTo(tipX, tipY);
        this.aimArrowGfx.strokePath();

        this.aimArrowGfx.fillStyle(0xffee44, 1);
        this.aimArrowGfx.fillTriangle(
          tipX,
          tipY,
          tipX - d.vx * 14 + px * hw,
          tipY - d.vy * 14 + py * hw,
          tipX - d.vx * 14 - px * hw,
          tipY - d.vy * 14 - py * hw
        );
      }

      syncBallToPaddle() {
        if (this.ballOnPaddle && this.paddle) {
          this.ball.x = this.paddle.x;
          const above = this.paddle.displayHeight * 0.5 + this.ballRadius + 2;
          this.ball.y = this.paddle.y - above;
        }
        if (this.ballOnPaddle && !this.isLosingBall) this.redrawAimArrow();
      }

      launchBall() {
        if (!this.ballOnPaddle || this.gameState !== 'playing' || this.isLosingBall) return;
        this.stopLaunchAimCycle();
        const d = LAUNCH_AIM_DIRS[this.launchAimIndex];
        const charge = this.getLaunchChargeProgress();
        this.stopLaunchCharge(false);
        this.ballOnPaddle = false;
        this.ballLaunched = true;
        this.ball.body.moves = true;
        const speed = PHYSICS.launchSpeed * Phaser.Math.Linear(LAUNCH_BALL.minSpeedMul, 1, charge);
        this.ball.setVelocity(d.vx * speed, d.vy * speed);
        hapticLaunchRelease();
        this.playBallLaunchElastic(d, charge);
        this.startBallTrail();
      }

      startLaunchCharge() {
        if (!this.ball?.active || !this.ballOnPaddle || this.isLosingBall || this.launchChargeActive) return;

        this.launchChargeActive = true;
        this.tweens.killTweensOf(this.ball);

        const base = this.ballBaseScale ?? this.ball.scaleX ?? 1;
        const { chargeScaleX, chargeScaleY, chargeMs } = LAUNCH_BALL;

        this.launchChargeTween = this.tweens.add({
          targets: this.ball,
          scaleX: base * chargeScaleX,
          scaleY: base * chargeScaleY,
          duration: chargeMs,
          ease: 'Sine.easeIn',
          onUpdate: () => {
            this.syncBallPhysicsBody(this.ballRadius);
            hapticLaunchChargeTick(this.getLaunchChargeProgress());
          },
        });
        hapticLaunchChargeStart();
      }

      stopLaunchCharge(reset = false) {
        this.launchChargeActive = false;
        this.safeStopTween(this.launchChargeTween);
        this.launchChargeTween = null;
        if (reset && this.ballOnPaddle && this.ballBaseScale != null) {
          this.ball.setScale(this.ballBaseScale);
          this.syncBallPhysicsBody(this.ballRadius);
        }
      }

      getLaunchChargeProgress() {
        if (!this.ball?.active) return 0;
        const base = this.ballBaseScale ?? 1;
        const { chargeScaleX, chargeScaleY } = LAUNCH_BALL;
        const maxX = base * chargeScaleX;
        const maxY = base * chargeScaleY;
        const dx = maxX - base;
        const dy = base - maxY;
        const tX = dx > 1e-6 ? Phaser.Math.Clamp((this.ball.scaleX - base) / dx, 0, 1) : 1;
        const tY = dy > 1e-6 ? Phaser.Math.Clamp((base - this.ball.scaleY) / dy, 0, 1) : 1;
        return (tX + tY) * 0.5;
      }

      /** Stretch along aim from current charge squash → elastic round. */
      playBallLaunchElastic(aimDir, chargeProgress = 1) {
        if (!this.ball?.active) return;

        this.tweens.killTweensOf(this.ball);
        const base = this.ballBaseScale ?? this.ball.scaleX ?? 1;
        const len = Math.hypot(aimDir.vx, aimDir.vy) || 1;
        const nx = aimDir.vx / len;
        const ny = aimDir.vy / len;
        const { stretch, pinch, stretchMs, settleMs } = LAUNCH_BALL;
        const charge = Phaser.Math.Clamp(chargeProgress, 0, 1);

        const worldR = this.ballRadius * (this.ballPowerMode ? POWER_BALL.scale : 1);
        const syncBody = () => this.syncBallPhysicsBody(worldR);

        const stretchScaleX = base * (1 - pinch * Math.abs(ny) + stretch * Math.abs(nx));
        const stretchScaleY = base * (1 - pinch * Math.abs(nx) + stretch * Math.abs(ny));
        const popMs = Math.max(40, stretchMs * Phaser.Math.Linear(0.5, 1, charge));

        this.tweens.add({
          targets: this.ball,
          scaleX: stretchScaleX,
          scaleY: stretchScaleY,
          duration: popMs,
          ease: 'Quad.easeOut',
          onUpdate: syncBody,
          onComplete: () => {
            if (!this.isSceneActive() || !this.ball?.active || this.ballOnPaddle) return;
            this.tweens.add({
              targets: this.ball,
              scaleX: base,
              scaleY: base,
              duration: settleMs,
              ease: 'Elastic.easeOut',
              onUpdate: syncBody,
              onComplete: syncBody,
            });
          },
        });
      }

      // ---------------------------------------------------------------------------
      // Collisions
      // ---------------------------------------------------------------------------

      setupCollisions() {
        this.physics.add.collider(this.ball, this.blocks, this.onBallBlock, null, this);
        this.physics.add.collider(this.ball, this.paddle, this.onBallPaddle, null, this);
        this.physics.add.collider(this.ball, this.enemies, this.onBallEnemy, null, this);
        this.physics.add.overlap(this.ball, this.levelItems, this.onBallItem, null, this);
        this.physics.add.collider(this.enemies, this.blocks);
        this.physics.world.on('worldbounds', (body, up, down, left, right) => {
          if (body.gameObject !== this.ball || this.ballOnPaddle) return;
          if (left || right) {
            const v = body.velocity;
            this.ball.setVelocity(
              v.x * BALL_ANTI_STALL.sideWallVxDamp,
              v.y + BALL_ANTI_STALL.sideWallVyKick
            );
            this.clampBallSpeed();
          }
        });
      }

      onBallBlock(ball, block) {
        if (!block.active) return;

        if (block.getData('isBonusCollectible')) {
          this.collectBonusBlock(ball, block);
          return;
        }

        const typeId = block.getData('typeId') || 'normal';
        const result = resolveBlockHit(typeId, this.powerBounceActive || this.ballPowerMode);

        if (result.action === 'immune') {
          const def = getBlockDef(typeId);
          if (def.powerOnly) {
            bbPowerLog(
              `collider:${block.getData('gridCol')},${block.getData('gridRow')}`,
              {
                typeId,
                ball: { x: ball.x, y: ball.y },
                block: { x: block.x, y: block.y },
                vel: ball.body
                  ? { x: ball.body.velocity.x, y: ball.body.velocity.y }
                  : null,
                powered: !!(this.powerBounceActive || this.ballPowerMode),
                has3dMesh: !!this.threeOverlay?.hasBlockMesh?.(block),
              },
              80
            );
            try {
              this.bounceBallOffPowerBlock(ball, block);
              this.onPowerBlockResist(ball, block);
            } catch (err) {
              bbError('onBallBlock power resist', err);
            }
          } else {
            this.flashBlock(block, 0xaaaaaa);
            gameHaptic('blockImmune');
          }
          return;
        }

        if (result.action === 'hazard' || result.action === 'hazard_bounce') {
          this.onBallSpike(ball, block, result.action === 'hazard_bounce');
          return;
        }

        if (result.action === 'downgrade') {
          this.downgradeBlock(block, result.toType);
          gameHaptic('blockDowngrade');
          this.clampBallSpeed();
          return;
        }

        if (result.action === 'reveal') {
          this.revealHiddenBlock(block);
          return;
        }

        if (result.action === 'score_hit') {
          this.onScoreBlockHit(ball, block, result.powered);
          return;
        }

        if (result.action === 'destroy') {
          let points = result.points;
          if (this.powerBounceMultiplier) {
            points = Math.floor(points * SCORE.powerMultiplier);
          }
          this.awardDestroyPoints(points, block.x, block.y);
          this.destroyBlock(block);
          this.clampBallSpeed();
        }
      }

      playScoreBlockJitter(block) {
        if (!block?.active) return;

        const prevBase = block.getData('scoreJitterBaseX');
        if (prevBase != null) block.x = prevBase;
        block.getData('scoreJitterEvent')?.destroy();

        const baseX = block.x;
        block.setData('scoreJitterBaseX', baseX);

        const amp = Math.max(
          SCORE_BLOCK_JITTER.minAmp,
          block.displayWidth * SCORE_BLOCK_JITTER.ampFrac
        );
        const syncBody = () => {
          if (block.body) block.body.reset(block.x, block.y);
        };

        let step = 0;
        const ev = this.time.addEvent({
          delay: SCORE_BLOCK_JITTER.stepMs,
          repeat: SCORE_BLOCK_JITTER.steps - 1,
          callback: () => {
            if (!block.active) {
              ev.destroy();
              return;
            }
            const decay = 1 - step / SCORE_BLOCK_JITTER.steps;
            const sign = step % 2 === 0 ? 1 : -1;
            block.x = baseX + sign * amp * decay;
            syncBody();
            step += 1;
            if (step >= SCORE_BLOCK_JITTER.steps) {
              block.x = baseX;
              block.setData('scoreJitterBaseX', null);
              block.setData('scoreJitterEvent', null);
              syncBody();
            }
          },
        });
        block.setData('scoreJitterEvent', ev);
      }

      onScoreBlockHit(ball, block, powered) {
        const typeId = block.getData('typeId') || 'score';
        const def = getBlockDef(typeId);
        const tiers = def.scoreTiers || [50, 100, 200, 400, 800, 1600, 3200];
        const hits = (block.getData('scoreHits') || 0) + 1;
        const idx = Math.min(hits - 1, tiers.length - 1);
        let points = tiers[idx];
        if (powered && this.powerBounceMultiplier) {
          points = Math.floor(points * SCORE.powerMultiplier);
        }
        this.playScoreBlockJitter(block);
        this.awardDestroyPoints(points, block.x, block.y);
        block.setData('scoreHits', hits);
        this.flashBlock(block, 0xffaa44);
        gameHaptic('blockHit');
        this.clampBallSpeed();
        if (hits >= (def.maxHits ?? tiers.length)) {
          this.destroyScoreBlock(block);
        } else {
          this.threeOverlay?.triggerScoreBlockHit?.(block);
        }
      }

      playScoreStarLiberation2D(x, y, displayWidth, displayHeight) {
        const outerR = Math.min(displayWidth, displayHeight) * 0.2;

        const gfx = this.add.graphics({ x, y });
        gfx.setDepth(14);
        const drawStar = () => {
          gfx.clear();
          if (typeof drawDebossedNormalStarPhaser === 'function') {
            drawDebossedNormalStarPhaser(gfx, 0, 0, outerR);
          } else {
            gfx.fillStyle(0xffee44, 1);
            gfx.fillCircle(0, 0, outerR * 0.55);
          }
        };
        drawStar();

        const lib = SCORE_STAR_LIBERATION;
        const towardDelay = Math.floor(lib.spinMs * 0.2);
        const liftDelay = towardDelay + lib.towardMs;
        const awayDelay = liftDelay + lib.liftMs;
        const liftY = y - lib.liftY;
        const awayY = liftY - lib.awayY;

        this.tweens.add({
          targets: gfx,
          angle: lib.spinDeg,
          duration: lib.spinMs,
          ease: 'Quad.easeIn',
        });
        this.tweens.add({
          targets: gfx,
          scaleX: lib.towardScale,
          scaleY: lib.towardScale,
          duration: lib.towardMs,
          delay: towardDelay,
          ease: 'Quad.easeOut',
          onUpdate: drawStar,
        });
        this.tweens.add({
          targets: gfx,
          y: liftY,
          duration: lib.liftMs,
          delay: liftDelay,
          ease: 'Cubic.easeOut',
          onUpdate: drawStar,
        });
        this.tweens.add({
          targets: gfx,
          y: awayY,
          scaleX: lib.awayScale,
          scaleY: lib.awayScale,
          alpha: 0,
          duration: lib.awayMs,
          delay: awayDelay,
          ease: 'Cubic.easeIn',
          onUpdate: drawStar,
          onComplete: () => {
            if (gfx.active) gfx.destroy();
          },
        });
      }

      destroyScoreBlock(block) {
        if (!block?.active) return;

        block.getData('scoreJitterEvent')?.destroy();
        block.setData('scoreJitterBaseX', null);
        if (block.body) block.body.checkCollision.none = true;

        const bx = block.x;
        const by = block.y;
        const tint = this.getBlockDebrisTint(block);
        const dw = block.displayWidth;
        const dh = block.displayHeight;

        const teardownBlock = () => {
          if (!block.active) return;
          gameHaptic('blockDestroy');
          this.spawnBlockClayDebris(bx, by, tint);
          this.threeOverlay?.unregisterBlock(block);
          block.destroy();
        };

        if (this.threeOverlay?.releaseScoreBlockStar?.(block)) {
          block.setVisible(false);
          teardownBlock();
          return;
        }

        block.setVisible(false);
        teardownBlock();
        this.playScoreStarLiberation2D(bx, by, dw, dh);
      }

      applyHiddenReveal(block, options = {}) {
        const { syncThree = true } = options;
        let revealCell = block.getData('hiddenRevealCell') ?? 1;
        if (revealCell === 18 && block.getData('typeId') !== 'hidden_2x2') {
          revealCell = 1;
        }
        const toTypeId = getBlockTypeFromCell(revealCell) || 'normal';
        const def = getBlockDef(toTypeId);
        const col = block.getData('gridCol');
        const row = block.getData('gridRow');
        const { colSpan: revColSpan, rowSpan: revRowSpan } = getBlockFootprint(toTypeId);
        const prevColSpan = block.getData('colSpan') ?? 1;
        const prevRowSpan = block.getData('rowSpan') ?? 1;

        block.setData('typeId', toTypeId);
        block.setData('hiddenRevealed', true);
        block.setData('points', def.points);
        block.setData('isPower', def.powerOnly);
        block.setData('isHazard', Boolean(def.isHazard));
        block.setData('colSpan', revColSpan);
        block.setData('rowSpan', revRowSpan);
        block.setTexture(def.texture);
        block.clearTint();
        block.setAlpha(1);

        const pos =
          revColSpan > 1 || revRowSpan > 1
            ? this.levelGrid.cellSpanCenter(col, row, revColSpan, revRowSpan)
            : this.levelGrid.cellCenter(col, row);
        block.setPosition(pos.x, pos.y);
        if (toTypeId === 'score' || revColSpan > 1 || revRowSpan > 1 || isPowerBlockType(toTypeId)) {
          fitEntityToCellSpan(block, this.levelGrid, revColSpan, revRowSpan);
        } else if (revColSpan !== prevColSpan || revRowSpan !== prevRowSpan) {
          fitEntityToCell(block, this.levelGrid);
        }

        const countsClear = blockCountsTowardLevelClear(toTypeId);
        block.setData('countsTowardClear', countsClear);
        if (countsClear) this.blocksRemaining++;

        if (toTypeId === 'score') block.setData('scoreHits', 0);

        if (isNormalBlockType(toTypeId)) {
          block.setData('starPhase', normalStarTickerPhase(col ?? 0, row ?? 0));
          if (!this.threeOverlay?.hasBlockMesh?.(block)) {
            this.attachNormalBlockStar(block);
          }
        } else if (isGrayBlockType(toTypeId)) {
          if (!this.threeOverlay?.hasBlockMesh?.(block)) {
            this.attachGrayBlockStar(block);
          }
        }

        if (block.body) {
          block.body.checkCollision.none = false;
          block.refreshBody();
        }

        this.syncLevelCellsAfterHiddenReveal(block, toTypeId, revealCell);

        if (syncThree) this.threeOverlay?.updateBlock(block);
        gameHaptic('blockHit');
        this.clampBallSpeed();
        bbLog('hidden block revealed', { to: toTypeId, revealCell });
      }

      /** Keep playfield cells aligned with revealed block (score 2×2 footprint). */
      syncLevelCellsAfterHiddenReveal(block, toTypeId, revealCell) {
        const cells = this.level?.blocks?.cells;
        if (!cells) return;
        const col = block.getData('gridCol');
        const row = block.getData('gridRow');
        if (col == null || row == null) return;

        const anchor = resolveBlockAnchor(cells, col, row);
        const ac = anchor?.col ?? col;
        const ar = anchor?.row ?? row;
        const hidden2x2Cell =
          typeof globalThis.HIDDEN_2X2_BLOCK_CELL === 'number' ? globalThis.HIDDEN_2X2_BLOCK_CELL : 24;
        const hidden1Cell =
          typeof globalThis.HIDDEN_BLOCK_CELL === 'number' ? globalThis.HIDDEN_BLOCK_CELL : 23;

        if (anchor?.anchorCell === hidden2x2Cell) {
          if (typeof clearHidden2x2Footprint === 'function') {
            clearHidden2x2Footprint(cells, ac, ar);
          }
          if (typeof clearHiddenRevealFootprint === 'function') {
            clearHiddenRevealFootprint(this.level, ac, ar);
          }
        } else if (anchor?.anchorCell === hidden1Cell) {
          cells[ar][ac] = 0;
          if (typeof clearHiddenRevealCell === 'function') {
            clearHiddenRevealCell(this.level, ac, ar);
          }
        }

        if (toTypeId === 'score' && typeof paintScoreBlockCells === 'function') {
          paintScoreBlockCells(cells, ac, ar);
        } else if (anchor?.anchorCell === hidden2x2Cell) {
          const cell = revealCell || 1;
          cells[ar][ac] = cell;
        } else {
          const cell = revealCell || 1;
          cells[ar][ac] = cell;
        }
      }

      revealHiddenBlock(block) {
        if (!block?.active || block.getData('hiddenRevealed') || block.getData('hiddenRevealing')) {
          return;
        }
        block.setData('hiddenRevealing', true);
        block.setAlpha(1);

        const onMidpoint = () => {
          this.applyHiddenReveal(block, { syncThree: false });
          this.threeOverlay?.updateBlock(block);
        };
        const onDone = () => {
          block.setData('hiddenRevealing', false);
          block.setData('hiddenRevealFlipFx', null);
          this.threeOverlay?.updateBlock(block);
        };

        if (this.threeOverlay?.startHiddenBlockReveal?.(block, onMidpoint, onDone)) {
          return;
        }

        const baseSx = block.scaleX;
        const baseSy = block.scaleY;
        this.tweens.add({
          targets: block,
          scaleX: 0.04,
          duration: HIDDEN_BLOCK_FX.flipHalfMs,
          ease: 'Quad.easeIn',
          onComplete: () => {
            onMidpoint();
            block.scaleX = 0.04;
            block.scaleY = baseSy;
            this.tweens.add({
              targets: block,
              scaleX: baseSx,
              duration: HIDDEN_BLOCK_FX.flipHalfMs,
              ease: 'Quad.easeOut',
              onComplete: () => {
                block.setData('hiddenRevealFlipFx', null);
                onDone();
              },
            });
          },
        });
      }

      downgradeBlock(block, toTypeId) {
        const def = getBlockDef(toTypeId);
        const col = block.getData('gridCol');
        const row = block.getData('gridRow');
        const { colSpan, rowSpan } = getBlockFootprint(toTypeId);
        block.setTexture(def.texture);
        block.setData('typeId', toTypeId);
        block.setData('points', def.points);
        block.setData('isPower', def.powerOnly);
        block.setData('colSpan', colSpan);
        block.setData('rowSpan', rowSpan);
        const isLong = colSpan > 1 || rowSpan > 1;
        const isPower = isPowerBlockType(toTypeId);
        if (isLong || isPower) {
          const { x, y } = isLong
            ? this.levelGrid.cellSpanCenter(col, row, colSpan, rowSpan)
            : this.levelGrid.cellCenter(col, row);
          block.setPosition(x, y);
          fitEntityToCellSpan(block, this.levelGrid, colSpan, rowSpan);
        } else {
          const { x, y } = this.levelGrid.cellCenter(col, row);
          block.setPosition(x, y);
          fitEntityToCell(block, this.levelGrid);
        }
        block.refreshBody();
        this.threeOverlay?.updateBlock(block);
        const grayGfx = block.getData('grayStarGfx');
        if (grayGfx?.active) {
          grayGfx.destroy();
          block.setData('grayStarGfx', null);
        }
        if (isNormalBlockType(toTypeId)) {
          const col = block.getData('gridCol') ?? 0;
          const row = block.getData('gridRow') ?? 0;
          if (block.getData('starPhase') == null) {
            block.setData('starPhase', normalStarTickerPhase(col, row));
          }
          if (!this.threeOverlay?.hasBlockMesh?.(block)) {
            this.attachNormalBlockStar(block);
          }
        }
        this.playGrayDowngradeSpring(block);
        this.flashBlock(block, 0xdddddd);
        bbLog('block downgraded', { to: toTypeId });
      }

      /** Spring reaction when gray downgrades to normal (Phaser sprite or 3D mesh). */
      playGrayDowngradeSpring(block) {
        if (!block?.active) return;

        this.tweens.killTweensOf(block);
        block.setData('grayDowngradeFxStart', this.time.now);

        if (this.threeOverlay?.hasBlockMesh?.(block)) return;

        const baseX = block.scaleX;
        const baseY = block.scaleY;
        const { squashScaleX, squashScaleY, squashMs, settleMs } = GRAY_DOWNGRADE_FX;

        this.tweens.add({
          targets: block,
          scaleX: baseX * squashScaleX,
          scaleY: baseY * squashScaleY,
          duration: squashMs,
          ease: 'Quad.easeOut',
          onComplete: () => {
            if (!block.active) return;
            this.tweens.add({
              targets: block,
              scaleX: baseX,
              scaleY: baseY,
              duration: settleMs,
              ease: 'Elastic.easeOut',
              onComplete: () => {
                if (!block.active) return;
                block.setData('grayDowngradeFxStart', null);
              },
            });
          },
        });
      }

      onBallPaddle(ball, paddle) {
        if (this.ballOnPaddle) return;

        const diff = ball.x - paddle.x;
        const normalized = Phaser.Math.Clamp(diff / (paddle.displayWidth * 0.5), -1, 1);
        const now = this.time.now;
        const queueElapsed = now - this.powerBounceQueuedAt;
        const queuedPower =
          this.powerBounceQueued && queueElapsed <= POWER_BOUNCE.queueWindowMs;

        let vx = normalized * PHYSICS.ballSpeed * 0.85;
        let vy;

        const fingerStillDown = this.dragging;

        if (queuedPower) {
          bbLog('Power Bounce hit — trampoline spring + power ball');
          this.paddle.clearTint();
          // Amplified angle: center ≈ vertical, edges = sharper (spec)
          if (Math.abs(normalized) < 0.22) {
            vx = normalized * PHYSICS.ballSpeed * 0.4;
            vy = -PHYSICS.powerBounceSpeed * 1.1;
          } else {
            vx = normalized * PHYSICS.ballSpeed * PHYSICS.powerAngleAmp;
            vy = -PHYSICS.powerBounceSpeed;
          }
          this.powerBounceQueued = false;
          this.enterBallPowerMode();
          if (fingerStillDown) {
            // Spring plays on release so charge can continue until then
            this.pendingPowerSpring = true;
          } else {
            this.doPaddleSpringBounce();
          }
          this.flashBallPowerSuccess();
          this.threeOverlay?.triggerPaddlePowerStarSpin?.();
          this.triggerPerfectTimingFeedback();
        } else {
          if (this.powerBounceQueued) {
            bbLog('power bounce not applied', {
              queueElapsed,
              windowMs: POWER_BOUNCE.queueWindowMs,
              vy: ball.body.velocity.y,
            });
          }
          this.powerBounceQueued = false;
          vy = -Math.abs(ball.body.velocity.y) * PHYSICS.paddleBounceFactor;
          if (vy > -280) vy = -280;
          if (!fingerStillDown) {
            this.doPaddleNormalTap();
          }
        }

        ball.setVelocity(vx, vy);
        this.clampBallSpeed();

        if (fingerStillDown) {
          this.maintainPaddleChargeWhileDragging();
        }
      }

      onBallItem(ball, item) {
        if (!item?.active || this.gameState !== 'playing') return;

        const typeId = item.getData('typeId');
        const def = getItemDef(typeId);
        let points = getItemPoints(typeId);
        if (this.powerBounceMultiplier) {
          points = Math.floor(points * SCORE.powerMultiplier);
        }

        const { x, y } = item;
        this.tweens.killTweensOf(item);
        this.threeOverlay?.unregisterItem(item);
        this.awardDestroyPoints(points, x, y, { color: '#ff9de2' });
        if (points > 0) {
          this.spawnDestroyParticles(x, y, 0xff9de2);
        }
        gameHaptic('itemCollect');
        item.destroy();

        if (def?.effect === 'bonus_chance') {
          this.activateBonusChance();
        }

        this.clampBallSpeed();
        bbLog('item collected', { typeId, points, effect: def?.effect });
      }

      activateBonusChance() {
        let converted = 0;
        for (const block of this.blocks.getChildren()) {
          if (!block?.active || block.getData('isBonusCollectible')) continue;

          const typeId = block.getData('typeId');
          if (!canBlockBecomeBonus(typeId)) continue;

          const bonusPoints = getBonusCollectPoints(typeId, {
            scoreHits: block.getData('scoreHits') || 0,
          });

          this.applyBonusCollectibleBlock(block, bonusPoints, {
            originalTypeId: typeId,
            convertVisual: true,
          });
          converted++;
        }

        if (converted === 0) return;

        this.bonusChanceActive = true;
        this.bonusChanceEndsAt = performance.now() + BONUS_CHANCE.durationMs;
        this.showBonusChanceTimer(BONUS_CHANCE.durationMs);

        const g = this.levelGrid.config;
        const cx = g.originX + (g.cols * g.cellWidth) / 2;
        const cy = g.originY + (g.rows * g.cellHeight) * 0.38;
        spawnFloatingHint(this, cx, cy, 'BONUS CHANCE!', {
          fontSize: 22,
          color: '#ffd54f',
          rise: 28,
          duration: 1200,
        });
        bbLog('bonus chance activated', { converted, durationMs: BONUS_CHANCE.durationMs });
      }

      showBonusChanceTimer(msLeft) {
        const sec = Math.ceil(msLeft / 1000);
        if (!this.bonusChanceTimerText) {
          const g = this.levelGrid.config;
          this.bonusChanceTimerText = this.add
            .text(g.originX + (g.cols * g.cellWidth) / 2, g.originY + 6, `Bonus ${sec}`, {
              fontFamily: 'system-ui, -apple-system, sans-serif',
              fontSize: '20px',
              fontStyle: 'bold',
              color: '#ffd54f',
              stroke: '#1a1028',
              strokeThickness: 4,
            })
            .setOrigin(0.5, 0)
            .setDepth(150)
            .setScrollFactor(0);
        }
        this.bonusChanceTimerText.setText(`Bonus ${sec}`).setVisible(true);
      }

      hideBonusChanceTimer() {
        this.bonusChanceTimerText?.setVisible(false);
      }

      countBonusCollectibleBlocks() {
        return this.blocks.getChildren().filter((b) => b?.active && b.getData('isBonusCollectible')).length;
      }

      checkBonusChanceProgress() {
        if (!this.bonusChanceActive) return;
        if (this.countBonusCollectibleBlocks() > 0) return;
        this.completeBonusChance();
      }

      completeBonusChance() {
        if (!this.bonusChanceActive) return;
        this.bonusChanceActive = false;
        this.bonusChanceEndsAt = 0;
        this.hideBonusChanceTimer();

        const g = this.levelGrid.config;
        const cx = g.originX + (g.cols * g.cellWidth) / 2;
        const cy = g.originY + (g.rows * g.cellHeight) * 0.38;
        spawnFloatingHint(this, cx, cy, 'BONUS CLEAR!', {
          fontSize: 22,
          color: '#ffe66d',
          rise: 28,
          duration: 1200,
        });
        bbLog('bonus chance cleared');
      }

      /** End Bonus Chance — optionally revert uncollected blocks and show a hint. */
      endBonusChanceActive(options = {}) {
        if (!this.bonusChanceActive) return;

        const { revertUncollected = true, hint = null } = options;
        let reverted = 0;

        if (revertUncollected) {
          for (const block of this.blocks.getChildren()) {
            if (!block?.active || !block.getData('isBonusCollectible')) continue;
            this.revertBonusBlock(block);
            reverted++;
          }
        }

        this.bonusChanceActive = false;
        this.bonusChanceEndsAt = 0;
        this.hideBonusChanceTimer();

        if (hint && reverted > 0) {
          const g = this.levelGrid.config;
          const cx = g.originX + (g.cols * g.cellWidth) / 2;
          const cy = g.originY + (g.rows * g.cellHeight) * 0.38;
          spawnFloatingHint(this, cx, cy, hint, {
            fontSize: 22,
            color: '#ff9de2',
            rise: 28,
            duration: 1200,
          });
        }
        bbLog('bonus chance ended', { reverted, hint });
      }

      expireBonusChance() {
        this.endBonusChanceActive({ hint: 'TIME UP!' });
      }

      revertBonusBlock(block) {
        const revert = block.getData('bonusRevert');
        const typeId = revert?.typeId ?? block.getData('originalTypeId') ?? 'normal';
        const def = getBlockDef(typeId);

        block.setData('typeId', typeId);
        block.setData('isBonusCollectible', false);
        block.setData('bonusPoints', null);
        block.setData('bonusCollecting', false);
        block.setData('originalTypeId', null);
        block.setData('bonusRevert', null);
        block.clearTint();
        block.setAlpha(revert?.alpha ?? 1);

        const textureKey = revert?.textureKey ?? def.texture;
        if (textureKey && this.textures.exists(textureKey)) {
          block.setTexture(textureKey);
        }

        if (typeId === 'score') {
          block.setData('scoreHits', revert?.scoreHits ?? 0);
        }
        block.setData('points', revert?.points ?? def.points);
        block.setData('isPower', def.powerOnly);
        block.setData('isHazard', Boolean(def.isHazard));
        block.setData('countsTowardClear', blockCountsTowardLevelClear(typeId));

        if (block.body) {
          block.body.checkCollision.none = false;
          block.refreshBody();
        }
        this.threeOverlay?.updateBlock(block);
      }

      /** Bonus Chance block — collides to collect; ball keeps moving (no ricochet). */
      applyBonusCollectibleBlock(block, bonusPoints, options = {}) {
        if (!block.getData('bonusRevert')) {
          block.setData('bonusRevert', {
            typeId: block.getData('typeId'),
            textureKey: block.texture?.key,
            alpha: block.alpha,
            scoreHits: block.getData('scoreHits') || 0,
            points: block.getData('points'),
          });
        }

        const originalTypeId = options.originalTypeId ?? block.getData('typeId');
        block.setData('originalTypeId', originalTypeId);
        block.setData('bonusPoints', bonusPoints);
        block.setData('isBonusCollectible', true);
        block.setData('typeId', 'bonus');
        block.clearTint();
        if (options.convertVisual) {
          block.setAlpha(0.52);
        } else {
          block.setAlpha(0.88);
        }
        this.threeOverlay?.updateBlock(block);
      }

      collectBonusBlock(ball, block) {
        if (!block?.active || !block.getData('isBonusCollectible')) return;
        if (block.getData('bonusCollecting')) return;
        if (this.gameState !== 'playing') return;

        const pre = this.ballPreImpactVel;
        block.setData('bonusCollecting', true);

        let points = block.getData('bonusPoints') ?? 0;
        if (this.powerBounceMultiplier) {
          points = Math.floor(points * SCORE.powerMultiplier);
        }

        this.awardDestroyPoints(points, block.x, block.y, { color: '#ffe66d' });
        gameHaptic('bonusCollect', { force: true });
        this.destroyBlock(block);
        this.checkBonusChanceProgress();

        if (pre && ball?.body) {
          ball.setVelocity(pre.x, pre.y);
        }
        this.clampBallSpeed();
      }

      onBallEnemy(ball, enemy) {
        if (!enemy.active) return;

        const typeId = enemy.getData('typeId') || 'drifter';
        const { damage, pointsOnKill } = resolveEnemyHit(typeId, this.powerBounceActive);
        let hp = (enemy.getData('hp') || 1) - damage;
        enemy.setData('hp', hp);

        if (hp > 0) {
          this.flashEnemyHit(enemy);
          gameHaptic('enemyHit');
          this.clampBallSpeed();
          bbLog('enemy damaged', { typeId, hp, damage });
          return;
        }

        let points = pointsOnKill;
        if (this.powerBounceMultiplier) {
          points = Math.floor(points * SCORE.powerMultiplier);
        }
        const { x, y } = enemy;
        this.awardDestroyPoints(points, x, y);
        this.spawnDestroyParticles(x, y, COLORS.enemy);
        gameHaptic('enemyKill');
        enemy.destroy();
        this.clampBallSpeed();
        bbLog('enemy defeated', { typeId, points });
      }

      flashEnemyHit(enemy) {
        enemy.setTint(0xffffff);
        this.tweens.add({
          targets: enemy,
          alpha: 0.65,
          duration: 50,
          yoyo: true,
          onComplete: () => {
            if (enemy.active) {
              enemy.clearTint();
              enemy.setAlpha(1);
            }
          },
        });
      }

      onBallSpike(ball, block, poweredBounce) {
        if (this.ballOnPaddle || this.gameState !== 'playing') return;

        if (poweredBounce || this.ballPowerMode) {
          const pushX = ball.body.velocity.x * 1.05 || (ball.x < this.scale.width / 2 ? -140 : 140);
          ball.setVelocity(pushX, -Math.max(380, Math.abs(ball.body.velocity.y) * 1.2));
          this.spawnDestroyParticles(ball.x, ball.y, 0xffe66d);
          if (block?.active) this.flashBlock(block, 0xffe66d);
          this.clampBallSpeed();
          return;
        }

        gameHaptic('spike', { force: true });
        this.loseBall();
      }

      /** Average opaque color from block texture (cached per texture frame). */
      getBlockDebrisTint(block) {
        const typeId = block.getData('typeId') || 'normal';
        const fallback = CLAY_DEBRIS_TINT_FALLBACK[typeId] ?? CLAY_DEBRIS_TINT_FALLBACK.normal;
        const texKey = block.texture?.key;
        if (!texKey || !this.textures.exists(texKey)) return fallback;

        const frame = block.frame;
        const cacheKey = `${texKey}:${frame?.name ?? '__BASE'}`;
        if (this.blockDebrisTintCache.has(cacheKey)) {
          return this.blockDebrisTintCache.get(cacheKey);
        }

        const source = this.textures.get(texKey).getSourceImage();
        if (!source) {
          this.blockDebrisTintCache.set(cacheKey, fallback);
          return fallback;
        }

        const fw = frame?.cutWidth ?? source.width;
        const fh = frame?.cutHeight ?? source.height;
        const fx = frame?.cutX ?? 0;
        const fy = frame?.cutY ?? 0;
        const sw = Math.max(8, Math.floor(fw * 0.55));
        const sh = Math.max(8, Math.floor(fh * 0.55));
        const canvas = document.createElement('canvas');
        canvas.width = sw;
        canvas.height = sh;
