        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(source, fx + (fw - sw) / 2, fy + (fh - sh) / 2, sw, sh, 0, 0, sw, sh);

        const data = ctx.getImageData(0, 0, sw, sh).data;
        let r = 0;
        let g = 0;
        let b = 0;
        let weight = 0;
        for (let i = 0; i < data.length; i += 4) {
          const a = data[i + 3];
          if (a < 40) continue;
          const w = a / 255;
          r += data[i] * w;
          g += data[i + 1] * w;
          b += data[i + 2] * w;
          weight += w;
        }

        const tint =
          weight > 0
            ? ((Math.round(r / weight) << 16) | (Math.round(g / weight) << 8) | Math.round(b / weight))
            : fallback;
        this.blockDebrisTintCache.set(cacheKey, tint);
        return tint;
      }

      destroyBlock(block) {
        if (!block.getData('bonusCollecting')) {
          gameHaptic('blockDestroy');
        }
        const tint = this.getBlockDebrisTint(block);
        this.spawnBlockClayDebris(block.x, block.y, tint);
        const counted = blockCountsTowardLevelClear(block.getData('typeId'));
        this.threeOverlay?.unregisterBlock(block);
        block.destroy();
        if (counted) {
          this.blocksRemaining--;
          if (this.blocksRemaining <= 0) {
            this.time.delayedCall(300, () => this.showLevelClear());
          }
        }
      }

      flashBlock(block, color) {
        if (typeof isUnrevealedHiddenBlock === 'function' && isUnrevealedHiddenBlock(block)) {
          return;
        }
        this.tweens.add({
          targets: block,
          alpha: 0.5,
          duration: 60,
          yoyo: true,
        });
      }

      onPowerBlockResist(ball, block) {
        if (!block?.active || !ball?.body) {
          bbPowerLogAlways('resist:skip-inactive', {
            blockActive: block?.active,
            hasBallBody: !!ball?.body,
          });
          return;
        }

        const last = block.getData('lastPowerResistAt') || 0;
        const since = this.time.now - last;
        if (since < POWER_BLOCK_RESIST.cooldownMs) {
          bbPowerLog(
            `resist:cooldown:${block.getData('gridCol')},${block.getData('gridRow')}`,
            { sinceMs: Math.round(since), cooldownMs: POWER_BLOCK_RESIST.cooldownMs },
            200
          );
          return;
        }
        block.setData('lastPowerResistAt', this.time.now);

        bbPowerLogAlways('resist:fx', {
          typeId: block.getData('typeId'),
          col: block.getData('gridCol'),
          row: block.getData('gridRow'),
          has3dMesh: !!this.threeOverlay?.hasBlockMesh?.(block),
        });

        this.playPowerBlockResistFx(block);
        gameHaptic('powerResist');

        this.cameras.main.shake(
          POWER_BLOCK_RESIST.cameraShakeMs,
          POWER_BLOCK_RESIST.cameraShakeIntensity
        );
      }

      /**
       * Push the ball out of a power block and reflect velocity.
       * Runs every collider frame — FX/shake are debounced separately.
       */
      bounceBallOffPowerBlock(ball, block) {
        const body = ball.body;
        const blockBody = block.body;
        if (!body?.enable || !blockBody) {
          bbPowerLogAlways('bounce:skip-no-body', {
            bodyEnable: body?.enable,
            hasBlockBody: !!blockBody,
            typeId: block.getData('typeId'),
          });
          return;
        }

        const ballR = body.halfWidth;
        const bx = blockBody.center.x;
        const by = blockBody.center.y;
        const hw = blockBody.halfWidth;
        const hh = blockBody.halfHeight;

        const closestX = Phaser.Math.Clamp(ball.x, bx - hw, bx + hw);
        const closestY = Phaser.Math.Clamp(ball.y, by - hh, by + hh);
        let nx = ball.x - closestX;
        let ny = ball.y - closestY;
        let dist = Math.hypot(nx, ny);

        if (dist < 0.001) {
          nx = ball.x - bx;
          ny = ball.y - by;
          dist = Math.hypot(nx, ny);
          if (dist < 0.001) {
            nx = 0;
            ny = -1;
            dist = 1;
          }
        }

        nx /= dist;
        ny /= dist;

        const overlap = ballR - dist;
        const velIn = { x: body.velocity.x, y: body.velocity.y };
        const speedIn = Math.hypot(velIn.x, velIn.y);

        if (overlap > 0) {
          ball.x += nx * (overlap + 2);
          ball.y += ny * (overlap + 2);
        }

        const incoming = speedIn;
        const minSpeed = PHYSICS.ballSpeed * 0.75;
        const speed = Math.max(minSpeed, incoming * POWER_BLOCK_RESIST.ballSpeedMul);

        let vx = body.velocity.x;
        let vy = body.velocity.y;
        const dot = vx * nx + vy * ny;
        if (dot < 0) {
          vx -= 2 * dot * nx;
          vy -= 2 * dot * ny;
        }

        const outSpeed = Math.hypot(vx, vy);
        let bounceMode = 'reflect';
        if (outSpeed < minSpeed * 0.5) {
          bounceMode = 'min-speed-kick';
          vx = nx * speed;
          vy = ny * speed;
        } else if (outSpeed < minSpeed) {
          bounceMode = 'speed-boost';
          const scale = minSpeed / outSpeed;
          vx *= scale;
          vy *= scale;
        }

        ball.setVelocity(vx, vy);
        this.clampBallSpeed();

        const velOut = { x: body.velocity.x, y: body.velocity.y };
        const logKey = `bounce:${block.getData('gridCol')},${block.getData('gridRow')}`;
        bbPowerLog(logKey, {
          typeId: block.getData('typeId'),
          ballR,
          blockHalf: { hw, hh },
          blockCenter: { bx, by },
          closest: { x: closestX, y: closestY },
          normal: { nx, ny },
          overlap: Math.round(overlap * 100) / 100,
          dist: Math.round(dist * 100) / 100,
          bounceMode,
          velIn,
          velOut,
          speedIn: Math.round(speedIn),
          speedOut: Math.round(Math.hypot(velOut.x, velOut.y)),
          touching: {
            up: body.touching.up,
            down: body.touching.down,
            left: body.touching.left,
            right: body.touching.right,
          },
          blocked: {
            up: body.blocked.up,
            down: body.blocked.down,
            left: body.blocked.left,
            right: body.blocked.right,
          },
          ballPosAfter: { x: ball.x, y: ball.y },
        }, overlap > 0 || speedIn < 60 ? 80 : 200);
      }

      /** Detect ball resting inside a power block without collider firing. */
      debugPowerBlockOverlap() {
        if (!POWER_BLOCK_DEBUG || !this.ball?.body || this.ballOnPaddle) return;

        const body = this.ball.body;
        const ballR = body.halfWidth;
        const speed = Math.hypot(body.velocity.x, body.velocity.y);

        this.blocks?.getChildren().forEach((block) => {
          if (!block.active || !isPowerBlockType(block.getData('typeId'))) return;
          const bb = block.body;
          if (!bb) return;

          const bx = bb.center.x;
          const by = bb.center.y;
          const hw = bb.halfWidth;
          const hh = bb.halfHeight;
          const closestX = Phaser.Math.Clamp(this.ball.x, bx - hw, bx + hw);
          const closestY = Phaser.Math.Clamp(this.ball.y, by - hh, by + hh);
          const dist = Math.hypot(this.ball.x - closestX, this.ball.y - closestY);
          const overlap = ballR - dist;

          if (overlap > 1) {
            bbPowerLog(
              `stuck:${block.getData('gridCol')},${block.getData('gridRow')}`,
              {
                overlap: Math.round(overlap * 100) / 100,
                speed: Math.round(speed),
                vel: { x: body.velocity.x, y: body.velocity.y },
                ball: { x: this.ball.x, y: this.ball.y },
                block: { x: block.x, y: block.y },
                colliderOverlap: this.physics.overlap(this.ball, block),
              },
              250
            );
          }
        });
      }

      playPowerBlockResistFx(block) {
        this.tweens.killTweensOf(block);
        block.setData('powerResistFxStart', this.time.now);

        if (this.threeOverlay?.hasBlockMesh?.(block)) {
          bbPowerLogAlways('fx:3d-skip-phaser-tween', {
            typeId: block.getData('typeId'),
            col: block.getData('gridCol'),
            row: block.getData('gridRow'),
          });
          return;
        }

        this.playPowerBlockGodRay(block);

        const baseX = block.scaleX;
        const baseY = block.scaleY;

        this.tweens.add({
          targets: block,
          scaleX: baseX * POWER_BLOCK_RESIST.squashScaleX,
          scaleY: baseY * POWER_BLOCK_RESIST.squashScaleY,
          duration: POWER_BLOCK_RESIST.squashInMs,
          ease: 'Quad.easeOut',
          yoyo: true,
          onComplete: () => {
            if (!block.active) return;
            block.setScale(baseX, baseY);
          },
        });
      }

      /** Diagonal white god-ray sweep clipped to the block silhouette. */
      playPowerBlockGodRay(block) {
        if (!block?.active || !this.textures.exists('power_godray')) return;

        const bw = block.displayWidth;
        const bh = block.displayHeight;
        const span = Math.hypot(bw, bh);

        const root = this.add.container(block.x, block.y);
        root.setDepth(block.depth + 2);
        root.setAngle(POWER_BLOCK_RESIST.godRayAngleDeg);

        const mover = this.add.container(0, 0);
        root.add(mover);

        const rayH = span * POWER_BLOCK_RESIST.godRayLengthScale;
        const halo = this.add.image(0, 0, 'power_godray');
        halo.setBlendMode(Phaser.BlendModes.ADD);
        halo.setDisplaySize(span * POWER_BLOCK_RESIST.godRayHaloScale, rayH);
        halo.setAlpha(POWER_BLOCK_RESIST.godRayHaloAlpha);

        const core = this.add.image(0, 0, 'power_godray');
        core.setBlendMode(Phaser.BlendModes.ADD);
        core.setDisplaySize(span * POWER_BLOCK_RESIST.godRayCoreScale, rayH * 0.92);
        core.setAlpha(POWER_BLOCK_RESIST.godRayCoreAlpha);

        mover.add([halo, core]);

        if (typeof block.createBitmapMask === 'function') {
          root.setMask(block.createBitmapMask());
        }

        const travel = span * POWER_BLOCK_RESIST.godRayTravelScale;
        mover.x = -travel;
        this.tweens.add({
          targets: mover,
          x: travel,
          duration: POWER_BLOCK_RESIST.godRaySweepMs,
          ease: 'Sine.easeInOut',
          onComplete: () => {
            if (root.active) root.destroy();
          },
        });
      }

      // ---------------------------------------------------------------------------
      // Ball lifecycle
      // ---------------------------------------------------------------------------

      loseBall() {
        if (this.gameState !== 'playing' || this.isLosingBall) return;
        bbLog('loseBall', { livesBefore: this.lives });
        this.endBonusChanceActive();
        this.isLosingBall = true;
        this.lives--;
        gameHaptic('lifeLost', { force: true });
        this.updateUI();
        this.stopBallTrail();
        this.spawnDestroyParticles(this.ball.x, this.ball.y, COLORS.ball);

        if (this.lives <= 0) {
          this.stopLaunchAimCycle();
          this.ball.setActive(false).setVisible(false);
          this.stopBallTrail();
          this.showGameOver();
          return;
        }

        this.attachBallToPaddle(true);
        this.powerBounceQueued = false;
        this.time.delayedCall(400, () => {
          this.isLosingBall = false;
          this.startLaunchAimCycle();
        });
      }

      clampBallSpeed() {
        const v = this.ball.body.velocity;
        const speed = Math.sqrt(v.x * v.x + v.y * v.y);
        const cap = this.ballPowerMode ? PHYSICS.powerBallMaxSpeed : PHYSICS.ballMaxSpeed;
        if (speed > cap) {
          const scale = cap / speed;
          this.ball.setVelocity(v.x * scale, v.y * scale);
        }
        if (speed < 200 && this.ballLaunched && !this.ballOnPaddle) {
          const scale = 220 / speed;
          this.ball.setVelocity(v.x * scale, v.y * scale);
        }
        this.antiStallBallVelocity();
      }

      /** Keep |vy| and departure angle away from pure horizontal ping-pong. */
      antiStallBallVelocity() {
        if (!this.ball?.body || this.ballOnPaddle || !this.ballLaunched) return;

        let vx = this.ball.body.velocity.x;
        let vy = this.ball.body.velocity.y;
        let speed = Math.hypot(vx, vy);
        if (speed < 80) return;

        const base = this.ballPowerMode ? PHYSICS.powerBallMaxSpeed : PHYSICS.ballSpeed;
        const minVy =
          base *
          (this.ballPowerMode ? BALL_ANTI_STALL.minVyFracPower : BALL_ANTI_STALL.minVyFrac);
        const maxHoriz = BALL_ANTI_STALL.maxHorizRatio;
        let changed = false;

        const horizRatio = Math.abs(vx) / speed;
        if (horizRatio > maxHoriz) {
          const signX = Math.sign(vx) || 1;
          let signY = Math.sign(vy);
          if (signY === 0) {
            const b = this.physics.world.bounds;
            const midY = b.y + b.height * 0.5;
            signY = this.ball.y < midY ? 1 : -1;
          }
          vx = signX * speed * maxHoriz;
          const vert = Math.sqrt(Math.max(0, speed * speed - vx * vx));
          vy = signY * Math.max(minVy, vert);
          changed = true;
          speed = Math.hypot(vx, vy);
        }

        if (Math.abs(vy) < minVy) {
          if (Math.abs(vy) < minVy * 0.12) {
            vy = minVy;
          } else {
            vy = (vy >= 0 ? 1 : -1) * minVy;
          }
          changed = true;
        }

        if (!changed) return;

        const newSpeed = Math.hypot(vx, vy);
        if (newSpeed > 1 && Math.abs(newSpeed - speed) > 1) {
          const scale = speed / newSpeed;
          vx *= scale;
          vy *= scale;
        }
        this.ball.setVelocity(vx, vy);
      }

      // ---------------------------------------------------------------------------
      // Input — drag paddle on bottom half; RELEASE in timing window arms Power Bounce
      // ---------------------------------------------------------------------------

      isBallNearPaddleForCharge() {
        if (!this.ball?.body || !this.paddle) return false;
        const dy = this.ball.y - this.paddle.y;
        return (
          dy > -POWER_BOUNCE.chargeAbovePaddle &&
          dy < POWER_BOUNCE.chargeBelowPaddle &&
          this.ball.body.velocity.y > POWER_BOUNCE.minFallSpeed
        );
      }

      canArmPowerOnRelease() {
        if (!this.ball?.body || !this.paddle) return false;
        if (!this.ballLaunched || this.ballOnPaddle) return false;
        const dy = this.ball.y - this.paddle.y;
        const inZone = dy > -POWER_BOUNCE.armAbovePaddle && dy < POWER_BOUNCE.armBelowPaddle;
        const falling = this.ball.body.velocity.y > POWER_BOUNCE.minFallSpeed;
        return inZone && falling;
      }

      queuePowerBounceOnRelease(wasPaddleTouch) {
        if (this.gameState !== 'playing') return false;
        if (!wasPaddleTouch) {
          bbLog('power bounce not queued — no bottom-half touch');
          return false;
        }
        if (!this.canArmPowerOnRelease()) {
          bbLog('power bounce not queued — outside arm window', {
            dy: this.ball.y - this.paddle.y,
            vy: this.ball.body.velocity.y,
          });
          return false;
        }

        this.powerBounceQueued = true;
        this.powerBounceQueuedAt = this.time.now;
        bbLog('power bounce queued', {
          at: this.powerBounceQueuedAt,
          dy: this.ball.y - this.paddle.y,
          vy: this.ball.body.velocity.y,
        });
        return true;
      }

      setupInput() {
        this.input.on('pointerdown', (pointer) => {
          if (this.gameState !== 'playing') return;

          const { height } = this.scale;
          const bottomHalf = pointer.y > height * 0.5;
          this.pointerWasDragging = false;
          this.bottomHalfTouchThisStroke = bottomHalf;

          if (this.ballOnPaddle) {
            if (this.isLosingBall) return;
            if (bottomHalf) {
              this.dragging = true;
              this.movePaddleToPointer(pointer);
              this.startLaunchCharge();
            }
            return;
          }

          if (bottomHalf) {
            this.dragging = true;
            this.movePaddleToPointer(pointer);
          }
        });

        this.input.on('pointermove', (pointer) => {
          if (this.gameState !== 'playing' || !this.dragging) return;
          if (pointer.y > this.scale.height * 0.5) {
            this.pointerWasDragging = true;
            this.movePaddleToPointer(pointer);
          }
        });

        this.input.on('pointerup', () => {
          const wasPaddleTouch =
            this.bottomHalfTouchThisStroke || this.dragging || this.pointerWasDragging;
          const ballOnPaddleAtStart = this.ballOnPaddle;

          if (this.gameState === 'playing' && ballOnPaddleAtStart && !this.isLosingBall) {
            this.launchBall();
          } else if (this.launchChargeActive) {
            this.stopLaunchCharge(true);
          }

          if (this.gameState === 'playing' && wasPaddleTouch && !ballOnPaddleAtStart && !this.ballOnPaddle) {
            const queued = this.queuePowerBounceOnRelease(wasPaddleTouch);
            if (this.pendingPowerSpring) {
              this.pendingPowerSpring = false;
              this.doPaddleSpringBounce();
            } else {
              this.paddleReleaseAnimation(queued);
            }
          } else if (!this.paddleSpringing) {
            this.stopPaddleCharge(true);
          }

          this.dragging = false;
          this.pointerWasDragging = false;
          this.bottomHalfTouchThisStroke = false;
        });

        this.input.on('pointerupoutside', () => {
          if (this.launchChargeActive && this.ballOnPaddle) {
            this.stopLaunchCharge(true);
          }
        });
      }

      movePaddleToPointer(pointer) {
        const margin = 58;
        const { width } = this.scale;
        this.paddle.x = Phaser.Math.Clamp(pointer.x, margin, width - margin);
        if (this.ballOnPaddle) this.syncBallToPaddle();
      }

      // ---------------------------------------------------------------------------
      // UI
      // ---------------------------------------------------------------------------

      createUI() {
        const hud = this.levelGrid.hud;
        const maxLives = this.level.meta?.lives ?? 3;
        const textStyle = {
          fontFamily: 'system-ui, -apple-system, sans-serif',
          fontSize: '20px',
          fontStyle: 'bold',
          color: COLORS.text,
          stroke: '#3a0080',
          strokeThickness: 4,
        };

        if (!hud) {
          bbError('createUI', 'level.hud is required for HUD container');
          return;
        }

        const { x, y, width, height } = hud.bounds;
        this.hudContainer = this.add.container(x, y).setDepth(200).setScrollFactor(0);

        const hudBg = this.add.rectangle(width / 2, height / 2, width, height, 0x4a18a0, 0.96);
        this.hudContainer.add(hudBg);

        if (DEV_BORDERS) {
          const hudFrame = this.add.graphics();
          hudFrame.lineStyle(3, 0xffee44, 0.85);
          hudFrame.strokeRect(0, 0, width, height);
          this.hudContainer.add(hudFrame);
        }

        const pos = resolveHudLayout(this.level, { width, height }, { maxLives });
        const hudLayout = { ...DEFAULT_HUD_LAYOUT, ...(this.level.hudLayout || {}) };

        this.scoreText = this.add.text(pos.score.x, pos.score.y, 'Score: 0', textStyle).setOrigin(0, 0.5);
        this.hudContainer.add(this.scoreText);

        const lifeStep = 20;
        this.livesContainer = this.add.container(pos.livesContainer.x, pos.livesContainer.y);
        this.lifeIcons = [];
        for (let i = 0; i < maxLives; i++) {
          const icon = this.add.image(-i * lifeStep - 8, 0, 'life_icon').setScale(0.85);
          this.lifeIcons.push(icon);
          this.livesContainer.add(icon);
        }
        this.hudContainer.add(this.livesContainer);

        this.hudAvatarState = 'default';
        this.hudAvatarConfig = { ...(this.level.hudLayout?.avatar || {}) };

        this.hudAvatar = null;
        if (hudLayout.right && hudLayout.right.includes('avatar')) {
          const avSize = pos.avatar.size;
          const startKey = getHudAvatarTextureKey('default', this.hudAvatarConfig, this);
          this.hudAvatar = this.add
            .image(pos.avatar.x, pos.avatar.y, startKey)
            .setDisplaySize(avSize, avSize)
            .setOrigin(0.5, 0.5)
            .setData('hudAvatarSize', avSize);
          this.hudContainer.add(this.hudAvatar);
          this.updateHudAvatar();
        }

        this.playAreaDivider = null;
        if (DEV_BORDERS) {
          this.playAreaDivider = this.add.graphics().setDepth(199).setScrollFactor(0);
          this.playAreaDivider.lineStyle(3, 0xffee44, 0.65);
          this.playAreaDivider.lineBetween(x, y + height, x + width, y + height);
        }

        this.bonusChanceTimerText = null;
      }

      /** Updates portrait from gameplay state (power, lives, etc.). */
      updateHudAvatar() {
        if (!this.hudAvatar) return;
        const stateId = resolveHudAvatarState({
          gameState: this.gameState,
          ballPowerMode: this.ballPowerMode,
          lives: this.lives,
        });
        this.hudAvatarState = applyHudAvatarState(this.hudAvatar, stateId, this.hudAvatarConfig);
      }

      /**
       * Force a portrait state (e.g. after loading custom textures).
       * Gameplay will override on the next updateHudAvatar() unless you set a lock later.
       */
      setHudAvatarState(stateId) {
        if (!this.hudAvatar) return;
        this.hudAvatarState = applyHudAvatarState(this.hudAvatar, stateId, this.hudAvatarConfig);
      }

      updateUI() {
        this.scoreText.setText(`Score: ${this.score}`);
        this.lifeIcons.forEach((icon, i) => {
          icon.setAlpha(i < this.lives ? 1 : 0.25);
          icon.setTint(i < this.lives ? 0xffffff : 0x8844aa);
        });
        this.updateHudAvatar();
      }

      /** HUD score + arcade float at world position (blocks, enemies, items). */
      awardDestroyPoints(pts, worldX, worldY, popupOptions) {
        awardPointsAt(this, pts, worldX, worldY, popupOptions);
      }

      addScore(pts) {
        this.score += pts;
        this.scoreText.setText(`Score: ${this.score}`);
        this.tweens.add({
          targets: this.scoreText,
          scaleX: 1.15,
          scaleY: 1.15,
          duration: 80,
          yoyo: true,
        });
      }

      resetPaddleVisual() {
        if (!this.paddle) return;
        this.paddle.setScale(1);
        this.paddle.angle = 0;
        this.paddle.clearTint();
        if (this.paddleBaseW != null) {
          this.paddle.setDisplaySize(this.paddleBaseW, this.paddleBaseH);
          if (this.paddle.body) {
            this.paddle.body.setSize(this.paddleBaseW, this.paddleBaseH);
          }
        }
      }

      startPaddleCharge() {
        if (this.paddleCharging) return;
        this.preparePaddleForCharge();
        bbLog('paddle charge start');
        this.paddleCharging = true;
        this.paddle.setTint(0xccffff);

        this.paddleChargeScaleTween = this.tweens.add({
          targets: this.paddle,
          scaleX: 1.16,
          scaleY: 0.86,
          duration: 220,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut',
        });

        this.paddleChargeShakeTween = this.tweens.add({
          targets: this.paddle,
          angle: 3,
          duration: 42,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut',
        });
      }

      stopPaddleCharge(resetVisual) {
        this.paddleCharging = false;
        this.safeStopTween(this.paddleChargeScaleTween);
        this.safeStopTween(this.paddleChargeShakeTween);
        this.clearPaddleTweenRefs();
        if (resetVisual && !this.paddleSpringing) {
          this.resetPaddleVisual();
        }
      }

      maintainPaddleChargeWhileDragging() {
        if (!this.dragging || this.ballOnPaddle || !this.ballLaunched) return;
        if (!this.paddleCharging) {
          this.startPaddleCharge();
        }
      }

      updatePaddleCharge() {
        if (this.gameState !== 'playing' || this.ballOnPaddle || !this.ballLaunched) {
          if (this.paddleCharging) this.stopPaddleCharge(true);
          return;
        }

        // Recover if spring flag stuck after a killed/completed tween chain
        if (this.paddleSpringing && this.paddle && this.tweens.getTweensOf(this.paddle).length === 0) {
          bbLog('paddle spring flag stuck — resetting');
          this.finishPaddleSpring();
        }

        // Finger down: keep shake for whole drag (even after power spring / powered ball)
        if (this.dragging) {
          const canStartCharge = this.isBallNearPaddleForCharge() || this.paddleCharging;
          if (canStartCharge && !this.paddleCharging) {
            this.startPaddleCharge();
          }
          return;
        }

        // Finger up: only charge when ball is falling near paddle
        const ready = this.isBallNearPaddleForCharge();
        if (ready && !this.paddleCharging) {
          this.startPaddleCharge();
        } else if (!ready && this.paddleCharging) {
          this.stopPaddleCharge(true);
        }
      }

      clearBallPowerState() {
        if (this.powerBallTimer) {
          this.powerBallTimer.remove(false);
          this.powerBallTimer = null;
        }
        this.stopBallPowerCoolRings();
        this.tweens.killTweensOf(this.ball);
        this.ballPowerMode = false;
        this.ballPowerCooling = false;
        this.powerBounceActive = false;
        this.powerBounceMultiplier = false;
        this.applyBallTexture();
      }

      refreshPowerBallTimer() {
        if (this.powerBallTimer) this.powerBallTimer.remove(false);
        this.powerBallTimer = this.time.delayedCall(POWER_BALL.durationMs, () => {
          this.startBallPowerCooldown();
        });
      }

      enterBallPowerMode() {
        const chaining = this.ballPowerMode;

        if (this.powerBallTimer) this.powerBallTimer.remove(false);
        if (!chaining) this.tweens.killTweensOf(this.ball);
        this.stopBallPowerCoolRings();

        this.ballPowerMode = true;
        this.ballPowerCooling = false;
        this.powerBounceActive = true;
        this.powerBounceMultiplier = true;

        if (!chaining) gameHaptic('powerMode', { force: true });
        this.applyBallTexture();
        const powerScale = this.ballPowerScale();
        const powerWorldR = this.ballRadius * POWER_BALL.scale;
        const syncPowerBody = () => this.syncBallPhysicsBody(powerWorldR);
        if (!chaining) {
          this.tweens.add({
            targets: this.ball,
            scale: powerScale,
            duration: 120,
            ease: 'Back.easeOut',
            onUpdate: syncPowerBody,
            onComplete: syncPowerBody,
          });
        } else {
          this.ball.setScale(powerScale);
          syncPowerBody();
        }
        this.refreshPowerBallTimer();
      }

      startBallPowerCooldown() {
        if (!this.ball.active || this.ballOnPaddle) return;

        this.ballPowerMode = false;
        this.ballPowerCooling = true;
        this.powerBounceActive = false;
        this.powerBounceMultiplier = false;
        this.applyBallTexture();
        this.startBallPowerCoolRings();

        this.tweens.killTweensOf(this.ball);
        const normalScale = this.ballBaseScale;
        const syncNormalBody = () => this.syncBallPhysicsBody(this.ballRadius);
        this.tweens.add({
          targets: this.ball,
          scale: normalScale,
          duration: POWER_BALL.cooldownMs,
          ease: 'Sine.easeInOut',
          onUpdate: syncNormalBody,
          onComplete: () => {
            syncNormalBody();
            this.ballPowerCooling = false;
            this.stopBallPowerCoolRings();
          },
        });

        this.powerBallTimer = this.time.delayedCall(POWER_BALL.cooldownMs, () => {
          this.powerBallTimer = null;
          if (!this.ballPowerMode) {
            this.ballPowerCooling = false;
            this.stopBallPowerCoolRings();
          }
        });
      }

      startBallPowerCoolRings() {
        this.stopBallPowerCoolRings();
        if (!this.ball?.active || !this.textures.exists('power_cool_ring')) return;

        this._powerCoolRingTint = POWER_BALL.coolRingTintWarm;
        const warm = Phaser.Display.Color.ValueToColor(POWER_BALL.coolRingTintWarm);
        const cool = Phaser.Display.Color.ValueToColor(POWER_BALL.coolRingTintCool);

        const spawnRingBurst = () => {
          if (!this.ballPowerCooling || !this.ball?.active) return;

          const radius = Math.max(10, this.ball.displayWidth * 0.48);
          const circle = new Phaser.Geom.Circle(0, 0, radius);
          const emitter = this.add.particles(this.ball.x, this.ball.y, 'power_cool_ring', {
            blendMode: 'ADD',
            emitting: false,
            lifespan: POWER_BALL.coolRingLifespan,
            scale: { start: 0.28, end: 1.28 },
            alpha: { start: 0.82, end: 0 },
            speed: { min: 22, max: 38 },
            angle: { min: 0, max: 360 },
            tint: this._powerCoolRingTint ?? POWER_BALL.coolRingTintWarm,
            emitZone: {
              type: 'edge',
              source: circle,
              quantity: POWER_BALL.coolRingBurstCount,
              seamless: true,
            },
          });
          emitter.setDepth(10);
          emitter.explode(POWER_BALL.coolRingBurstCount);
          this.time.delayedCall(POWER_BALL.coolRingLifespan + 40, () => {
            if (emitter?.active) emitter.destroy();
          });
        };

        spawnRingBurst();
        const repeats = Math.max(0, Math.ceil(POWER_BALL.cooldownMs / POWER_BALL.coolRingBurstMs) - 1);
        this.powerCoolRingEvent = this.time.addEvent({
          delay: POWER_BALL.coolRingBurstMs,
          repeat: repeats,
          callback: spawnRingBurst,
        });

        this.powerCoolTintTween = this.tweens.addCounter({
          from: 0,
          to: 1,
          duration: POWER_BALL.cooldownMs,
          ease: 'Sine.easeInOut',
          onUpdate: (tw) => {
            const t = tw.getValue();
            const r = Phaser.Math.Linear(warm.red, cool.red, t);
            const g = Phaser.Math.Linear(warm.green, cool.green, t);
            const b = Phaser.Math.Linear(warm.blue, cool.blue, t);
            this._powerCoolRingTint = Phaser.Display.Color.GetColor(r, g, b);
          },
        });
      }

      stopBallPowerCoolRings() {
        if (this.powerCoolTintTween) {
          this.powerCoolTintTween.stop();
          this.powerCoolTintTween = null;
        }
        if (this.powerCoolRingEvent) {
          this.powerCoolRingEvent.destroy();
          this.powerCoolRingEvent = null;
        }
        this._powerCoolRingTint = null;
      }

      // ---------------------------------------------------------------------------
      // Effects
      // ---------------------------------------------------------------------------

      /**
       * Always plays on bottom-half release while ball is in play.
       * @param {boolean} armed — power queued; holds coil until ball hits or window expires
       */
      paddleReleaseAnimation(armed) {
        bbLog('paddle release animation', { armed });
        this.stopPaddleCharge(false);
        this.killPaddleTweens();
        this.paddleSpringing = true;

        const coilScaleX = armed ? 1.34 : 1.2;
        const coilScaleY = armed ? 0.5 : 0.64;

        if (armed) {
          this.paddle.setTint(0xffffff);
        } else {
          this.paddle.clearTint();
        }

        this.tweens.add({
          targets: this.paddle,
          scaleX: coilScaleX,
          scaleY: coilScaleY,
          angle: 0,
          duration: armed ? 75 : 60,
          ease: 'Quad.easeIn',
          onComplete: () => {
            if (!this.isSceneActive()) return;

            if (armed) {
              // Stay coiled — full trampoline spring runs on successful power hit
              this.paddleSpringing = false;
              return;
            }

            // Miss / early release: small rebound, then rest
            this.tweens.add({
              targets: this.paddle,
              scaleX: 1.08,
              scaleY: 1.06,
              duration: 85,
              ease: 'Back.easeOut',
              onComplete: () => {
                if (!this.isSceneActive()) return;
                this.tweens.add({
                  targets: this.paddle,
                  scaleX: 1,
                  scaleY: 1,
                  duration: 110,
                  ease: 'Quad.easeOut',
                  onComplete: () => {
                    if (!this.isSceneActive()) return;
                    this.finishPaddleSpring();
                  },
                });
              },
            });
          },
        });
      }

      /** Trampoline spring on successful Power Bounce contact */
      doPaddleSpringBounce() {
        bbLog('paddle spring bounce');
        this.stopPaddleCharge(false);
        this.killPaddleTweens();
        this.paddleSpringing = true;
        this.paddle.clearTint();

        this.tweens.add({
          targets: this.paddle,
          scaleX: 1.58,
          scaleY: 0.4,
          angle: 0,
          duration: 45,
          ease: 'Quad.easeIn',
          onComplete: () => {
            if (!this.isSceneActive()) return;
            this.tweens.add({
              targets: this.paddle,
              scaleX: 1.22,
              scaleY: 1.42,
              duration: 95,
              ease: 'Back.easeOut',
              onComplete: () => {
                if (!this.isSceneActive()) return;
                this.tweens.add({
                  targets: this.paddle,
                  scaleX: 1,
                  scaleY: 1,
                  duration: 280,
                  ease: 'Bounce.easeOut',
                  onComplete: () => {
                    if (!this.isSceneActive()) return;
                    this.finishPaddleSpring();
                  },
                });
              },
            });
          },
        });
      }

      /** Subtle trampoline tap on a normal bounce */
      doPaddleNormalTap() {
        if (this.paddleCharging) return;
        gameHaptic('paddleTap');
        this.paddleSpringing = true;
        this.killPaddleTweens();
        this.tweens.add({
          targets: this.paddle,
          scaleX: 1.1,
          scaleY: 0.72,
          duration: 50,
          yoyo: true,
          ease: 'Quad.easeOut',
          onComplete: () => {
            if (!this.isSceneActive()) return;
            this.finishPaddleSpring();
          },
        });
      }

      flashBallPowerSuccess() {
        this.ball.setTint(0xffffff);
        this.time.delayedCall(90, () => {
          if (this.ball.active && this.ballPowerMode) {
            this.ball.clearTint();
          }
        });
      }

      triggerPerfectTimingFeedback() {
        gameHaptic('perfectTiming', { force: true });

        const overlay = this.add.rectangle(
          this.scale.width / 2,
          this.scale.height / 2,
          this.scale.width,
          this.scale.height,
          0xffffff,
          0.12
        ).setDepth(150);

        this.tweens.add({
          targets: overlay,
          alpha: 0,
          duration: POWER_BOUNCE.slowMoRealMs,
          onComplete: () => overlay.destroy(),
        });

        const prevScale = this.time.timeScale;
        this.time.timeScale = POWER_BOUNCE.slowMoTimeScale;
        window.setTimeout(() => {
          if (!this.isSceneActive()) return;
          if (this.time) this.time.timeScale = prevScale === 0 ? 1 : prevScale;
        }, POWER_BOUNCE.slowMoRealMs);
      }

      spawnDestroyParticles(x, y, tint) {
        const emitter = this.add.particles(x, y, 'particle', {
          speed: { min: 60, max: 180 },
          angle: { min: 0, max: 360 },
          scale: { start: 1.2, end: 0 },
          lifespan: 350,
          tint,
          blendMode: 'ADD',
          emitting: false,
        });
        emitter.explode(10);
        this.time.delayedCall(400, () => emitter.destroy());
      }

      /** Chunky clay crumbs when a block is destroyed. */
      spawnBlockClayDebris(x, y, tint) {
        const emitter = this.add.particles(x, y, 'clay_debris', {
          frame: ['chunk_a', 'chunk_b', 'chunk_c', 'chunk_d'],
          speed: { min: 45, max: 130 },
          angle: { min: 0, max: 360 },
          gravityY: 420,
          scale: { start: 1, end: 0.2, random: true },
          alpha: { start: 1, end: 0 },
          rotate: { min: 0, max: 360 },
          lifespan: { min: 500, max: 800 },
          tint,
          blendMode: 'NORMAL',
          emitting: false,
        });
        emitter.setDepth(12);
        emitter.explode(14);
        this.time.delayedCall(900, () => emitter.destroy());
      }

      // ---------------------------------------------------------------------------
      // End screens
      // ---------------------------------------------------------------------------

      showOverlay(title, subtitle, buttonLabel, onRestart) {
        showGameModalOverlay(this, {
          title,
          subtitle,
          buttons: [{ label: buttonLabel, primary: true, onClick: onRestart }],
        });
      }

      showMultiButtonOverlay(title, subtitle, buttons) {
        showGameModalOverlay(this, { title, subtitle, buttons });
      }

      updateBonusChanceTimer() {
        if (!this.bonusChanceActive || !this.bonusChanceEndsAt) return;

        const msLeft = this.bonusChanceEndsAt - performance.now();
        if (msLeft <= 0) {
          this.expireBonusChance();
          return;
        }
        this.showBonusChanceTimer(msLeft);
      }

      showLevelClear() {
        if (this.gameState !== 'playing') return;
        this.bonusChanceActive = false;
        this.bonusChanceEndsAt = 0;
        this.hideBonusChanceTimer();
        this.gameState = 'levelClear';
        this.stopLaunchAimCycle();
        this.stopLaunchCharge(true);
        gameHaptic('levelClear', { force: true });
        this.ball.body.setVelocity(0, 0);
        this.ball.body.moves = false;

        if (ACTIVE_CAMPAIGN_CTX) {
          const { campaign, worldId, worldName, stageIndex, stageNumber } = ACTIVE_CAMPAIGN_CTX;
          markStageCompleted(worldId, stageIndex);
          const next = getNextStage(campaign, worldId, stageIndex);
          let title = 'Stage Clear!';
          if (!next) {
            title = 'Campaign Complete!';
          } else if (next.worldId !== worldId) {
            title = 'World Complete!';
          }
          const subtitle = `${worldName} — Stage ${stageNumber}\nFinal Score: ${this.score}`;
          const buttons = [];
          if (next) {
            buttons.push({
              label: 'Next Stage',
              primary: true,
              onClick: () => {
                window.location.href = campaignPlayUrl(next.worldId, next.stageIndex + 1);
              },
            });
          } else {
            buttons.push({
              label: 'Play Again',
              primary: true,
              onClick: () => this.scene.restart(),
            });
          }
          buttons.push({
            label: 'World Map',
            primary: false,
            onClick: () => {
              window.location.href = campaignMenuUrl(next ? next.worldId : null);
            },
          });
          this.showMultiButtonOverlay(title, subtitle, buttons);
          return;
        }

        this.showOverlay('Level Clear!', `Final Score: ${this.score}`, 'Play Again', () => this.scene.restart());
      }

      showGameOver() {
        this.bonusChanceActive = false;
        this.bonusChanceEndsAt = 0;
        this.hideBonusChanceTimer();
        this.gameState = 'gameOver';
        gameHaptic('gameOver', { force: true });
        this.stopLaunchCharge(true);
        this.stopLaunchAimCycle();
        this.showOverlay('Game Over', `Score: ${this.score}`, 'Try Again', () => this.scene.restart());
      }

      // ---------------------------------------------------------------------------
      // Update loop
      // ---------------------------------------------------------------------------

      update(time, delta) {
        if (this.gameState !== 'playing') return;

        try {
          if (this.ballOnPaddle) {
            this.syncBallToPaddle();
          } else if (this.ball?.active) {
            if (!this.ballOnPaddle && this.ball.body) {
              this.ballPreImpactVel = {
                x: this.ball.body.velocity.x,
                y: this.ball.body.velocity.y,
              };
            }
            this.clampBallSpeed();
            this.updateBallSpin(delta);
            this.updateBallTrail();
            this.debugPowerBlockOverlap();
          }

          this.updatePaddleCharge();
          this.updateHudAvatar();
          this.updateBonusChanceTimer();

          updateParallaxGridBackground(this, delta);

          this.updateNormalBlockStars(time);
          this.updateGrayBlockStars();

          // Expire stale power bounce queue
          if (this.powerBounceQueued && time - this.powerBounceQueuedAt > POWER_BOUNCE.queueWindowMs) {
            this.powerBounceQueued = false;
            if (!this.paddleSpringing && !this.paddleCharging) {
              this.killPaddleTweens();
              this.resetPaddleVisual();
            }
          }

          // Keep enemy hitboxes aligned with tweened positions
          this.enemies?.getChildren().forEach((enemy) => {
            if (enemy.active && enemy.body) {
              enemy.body.reset(enemy.x, enemy.y);
            }
          });
        } catch (err) {
          bbError('update()', err);
        }
      }
    }

    // =============================================================================
    // PHASER BOOT
    // =============================================================================

    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: GAME_WIDTH,
      height: GAME_HEIGHT,
      backgroundColor: '#f6f6f6',
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
      },
      physics: {
        default: 'arcade',
        arcade: {
          gravity: { y: 0 },
          debug: false,
        },
      },
      scene: [GameScene],
      render: {
        antialias: true,
        pixelArt: false,
        roundPixels: true,
      },
    };

    bbLog('boot Phaser', { width: GAME_WIDTH, height: GAME_HEIGHT, powerBlockDebug: POWER_BLOCK_DEBUG });

    function initLevelBar(activeEntry, campaignCtx) {
      const bar = document.getElementById('level-bar');
      const select = document.getElementById('level-select');
      const selectLabel = document.getElementById('level-select-label');
      const campaignLabel = document.getElementById('campaign-label');

      if (campaignCtx) {
        selectLabel.hidden = true;
        select.hidden = true;
        campaignLabel.hidden = false;
        campaignLabel.textContent = `${campaignCtx.worldName} — Stage ${campaignCtx.stageNumber}`;
      } else if (activeEntry.id === 'preview') {
        const opt = document.createElement('option');
        opt.value = 'preview';
        opt.textContent = activeEntry.name || 'Editor preview';
        opt.selected = true;
        select.appendChild(opt);
        select.disabled = true;
      } else {
        populateLevelSelect(select, activeEntry.id);
      }
      bar.hidden = false;

      if (!campaignCtx) {
        select.addEventListener('change', () => {
          const id = select.value;
          try {
            localStorage.setItem('blockBall.level', id);
          } catch (_) {
            /* ignore */
          }
          window.location.search = `?level=${encodeURIComponent(id)}`;
        });
      }

      document.getElementById('level-restart').addEventListener('click', () => {
        window.location.reload();
      });

      const btn3d = document.getElementById('toggle-3d');
      if (btn3d) {
        btn3d.textContent = USE_3D_OVERLAY ? '3D: on' : '3D: off';
        btn3d.addEventListener('click', () => {
          try {
            if (USE_3D_OVERLAY) {
              localStorage.removeItem('blockBall.use3d');
            } else {
              localStorage.setItem('blockBall.use3d', '1');
            }
          } catch (_) {
            /* private mode */
          }
          const url = new URL(window.location.href);
          url.searchParams.set('3d', USE_3D_OVERLAY ? '0' : '1');
          window.location.href = url.pathname + url.search;
        });
      }

      const btnDevBorders = document.getElementById('toggle-dev-borders');
      if (btnDevBorders) {
        btnDevBorders.textContent = DEV_BORDERS ? 'Borders: on' : 'Borders: off';
        btnDevBorders.addEventListener('click', () => {
          try {
            if (DEV_BORDERS) {
              localStorage.setItem('blockBall.devBorders', '0');
            } else {
              localStorage.removeItem('blockBall.devBorders');
            }
          } catch (_) {
            /* private mode */
          }
          const url = new URL(window.location.href);
          url.searchParams.set('devBorders', DEV_BORDERS ? '0' : '1');
          window.location.href = url.pathname + url.search;
        });
      }
    }

    async function bootGame() {
      const status = document.getElementById('boot-status');
      bbLog('bootGame start', {
        href: window.location.href,
        search: window.location.search,
        previewFlag: URL_PARAMS.get('preview'),
      });
      try {
        const { level, entry, campaignCtx } = await resolveActiveLevel();
        ACTIVE_LEVEL = level;
        ACTIVE_CAMPAIGN_CTX = campaignCtx || null;
        const cells = level.blocks?.cells;
        let filled = 0;
        if (cells) for (const row of cells) for (const c of row) if (c) filled += 1;
        bbLog('bootGame active level', {
          entryId: entry.id,
          entryName: entry.name,
          levelId: level.id,
          levelName: level.name,
          filledCells: filled,
          grid: cells ? `${cells.length}×${cells[0]?.length}` : 'none',
          enemies: level.enemies?.length ?? 0,
          items: level.items?.length ?? 0,
        });
        if (USE_3D_OVERLAY) {
          const mod = await import('./three-overlay.js');
          window.__blockBallThreeOverlay = mod.createThreeOverlay;
          await mod.loadBallFaceTexture();
          bbLog('3D overlay module loaded');
        }
        status.remove();
        initLevelBar(entry, campaignCtx || null);
        window.__blockBallGame = new Phaser.Game(config);
        bbLog('Phaser.Game created');
      } catch (err) {
        bbError('bootGame failed', err);
        status.className = 'error';
        status.textContent = `Failed to load level: ${err.message}`;
      }
    }

    bootGame();
  </script>

  <!--
================================================================================
  KNOWN LIMITATIONS & SUGGESTED NEXT STEPS
================================================================================

LIMITATIONS (this demo)
-----------------------
  • Level select bar + ?level=id URL; register levels in levels/registry.js.
  • Ball, blocks, paddle, items, enemies: procedural placeholders (generateTextures / editor-entity-art).
  • Power Bounce: release-only timing before contact; spike immunity while powered.
  • Enemies use simple tweens, not true AI or spawn waves.
  • No pause menu, settings, save data, or online leaderboards.
  • Desktop keyboard controls not implemented (touch-first).
  • Block collision uses default Arcade separation (adequate for demo scale).

NEXT STEPS FOR A FULL GAME
--------------------------
  1. Level data: JSON arrays per level + loader scene; unlock progression.
  2. Asset pipeline: TexturePacker atlases, SFX/music (Howler or Phaser sound).
  3. Power-ups: multi-ball, wider paddle, laser — extend Power Bounce system.
  4. Scene flow: Boot → Menu → Level Select → Game → Results → Shop.
  5. Mobile polish: haptics (Capacitor), safe areas, adaptive HUD scaling.
  6. Performance: object pooling for particles/blocks; static body batching.
  7. Testing: unit tests for score math; Playwright/device farm for touch QA.
  8. Monetization / analytics only if product requires — keep gameplay fair.

================================================================================
